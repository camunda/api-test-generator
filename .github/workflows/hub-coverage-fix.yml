# description: Coverage-fix agent for the camunda-hub generated API tests. Reads the weekly
#              response-coverage report, picks the gaps the playbook allows (a resource with
#              no create-read-delete test, or an operation with no 403 or 404 test), and runs
#              a Claude Code agent that opens small draft PRs in api-test-generator, or writes a
#              proposal when a gap needs more than a config entry. The limits (no weekly cap, one PR per
#              API area) are enforced in code before the agent starts. camunda-hub is read
#              only: no token for it is given to the agent. A manual run is a dry run unless you
#              untick it. It also starts by itself, as a real run, after the scheduled weekly report,
#              unless the repository variable COVERAGE_FIX_AUTO is set to "false" (epic #678).
# type: CI
# owner: @camunda/test-automation-team
---
name: Hub coverage fix agent

on:
  # After the scheduled weekly report, a real run, on by default. Set the repository variable COVERAGE_FIX_AUTO to
  # "false" to turn it off without a code change (delete it or set it to anything else to turn it on again). It only
  # starts when the report run succeeded, was started by the schedule (not by hand) and ran on main. The workflow
  # file used is the one on the default branch.
  workflow_run:
    workflows: ['Hub response coverage']
    types: [completed]
  workflow_dispatch:
    inputs:
      coverage_run_id:
        description: 'Run ID of a "Hub response coverage" run with the hub-coverage-report artifact. Empty: the latest successful run.'
        required: false
      dry_run:
        description: 'Dry run: the agent works locally and reports what it would open. No write token is given, nothing is pushed.'
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  # Read the report run's artifact (download-artifact across runs).
  actions: read
  # Read the agent's own PR history and the open PRs (github.token, not the App token).
  pull-requests: read

# Never overlap two coverage-fix runs: the busy areas are counted from the PR list at the start.
concurrency:
  group: hub-coverage-fix
  cancel-in-progress: false

env:
  CONFIG: camunda-hub
  # A run after the weekly report is a real run; a manual run is a dry run unless the box is unticked.
  DRY_RUN: ${{ github.event_name == 'workflow_run' && 'false' || github.event.inputs.dry_run || 'true' }}

jobs:
  fix-secrets:
    name: Wrap secrets for the coverage-fix agent
    if: >-
      ${{ github.event_name != 'workflow_run' || (
        vars.COVERAGE_FIX_AUTO != 'false'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'schedule'
        && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      wrap-token: ${{ steps.wrap.outputs.wrap-token }}
    steps:
      # --- Credentials ---------------------------------------------------------
      # The only write token. Scoped to api-test-generator (the same grant spec-bump-check.yml uses
      # for its bump PRs). There is deliberately NO token for camunda-hub: the agent cannot write
      # there. In a dry run no write token is minted at all, so nothing can be pushed.
      - name: Generate qa-processes App token (api-test-generator draft PRs)
        id: qa-token-generator
        if: ${{ env.DRY_RUN != 'true' }}
        continue-on-error: true
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@7a9c6f3e477321400802c88290068f88a7ed5684
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          vault-auth-method: jwt
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: api-test-generator
          skip-token-revoke: true

      # Read-only clone token for the private camunda-hub (Contents: Read).
      - name: Mint camunda-hub clone token
        id: hub-token
        # Empty on failure: the agent job stops with a clear error at "Configure git credentials" when it needs the token.
        continue-on-error: true
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@7a9c6f3e477321400802c88290068f88a7ed5684
        with:
          github-app-id-vault-key: GITHUB_PREVIEW_ENVIRONMENTS_APP_ID
          github-app-id-vault-path: secret/data/products/web-modeler/ci/preview-envs
          github-app-private-key-vault-key: GITHUB_PREVIEW_ENVIRONMENTS_APP_PRIVATE_KEY
          github-app-private-key-vault-path: secret/data/products/web-modeler/ci/preview-envs
          vault-auth-method: jwt
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: camunda-hub
          skip-token-revoke: true

      - name: Wrap secrets for the agent job
        id: wrap
        uses: camunda/infra-global-github-actions/vault-wrapped-secrets/wrap@20cb58c9ce170db539d649284bae2c35440ababd # vault-wrapped-secrets-1.0.2
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-auth-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-auth-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-auth-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/qa/ci/common CLAUDE_API_KEY | ANTHROPIC_API_KEY
            secret/data/products/qa/ci/common GH_TOKEN | GH_PAT
          values: '{"GH_TOKEN_GENERATOR": "${{ steps.qa-token-generator.outputs.token }}", "HUB_CLONE_TOKEN": "${{ steps.hub-token.outputs.token }}"}'

  fix:
    name: Report → limits → workspace → Claude coverage-fix → result
    # A manual run always goes ahead. A run after the weekly report goes ahead unless it is switched off, and needs a
    # good report run.
    if: >-
      ${{ github.event_name != 'workflow_run' || (
        vars.COVERAGE_FIX_AUTO != 'false'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'schedule'
        && github.event.workflow_run.head_branch == 'main') }}
    needs: fix-secrets
    # The steps live in a reusable workflow so the wrapping token arrives there as a secret, which GitHub masks; a
    # plain job output would be printed in clear text in the agent job's log (camunda/infra-global-github-actions#925).
    uses: ./.github/workflows/_hub-coverage-fix-agent.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      WRAP_TOKEN: ${{ needs.fix-secrets.outputs.wrap-token }}
    with:
      # The env context is not available here: same expression as the workflow-level DRY_RUN above.
      dry-run: ${{ github.event_name == 'workflow_run' && 'false' || github.event.inputs.dry_run || 'true' }}
      report-dir: ${{ github.workspace }}/coverage-report

  # A second job on purpose. The agent runs unrestricted on the runner of the `fix` job, as the same user as the
  # workflow steps, so anything on that runner (the verifier code, the selection, a result file) could be
  # rewritten by it. This job runs on a fresh runner, checks out the code again, and takes the selection and the
  # PR snapshot from an artifact that was stored before the agent started.
  verify:
    name: Verify what the agent did, from GitHub, on a clean runner
    needs: fix
    # Also after a failed agent step: a failed run can still have left PRs behind. Skipped when the run never
    # reached the agent (no baseline) or had nothing to do.
    if: ${{ always() && needs.fix.outputs.baseline != '' && needs.fix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Write: pin each verified commit under a tag, so the live check runs exactly what was verified.
      contents: write
      # Write: start the live Hub check (hub-ondemand-test.yml) on each verified PR and comment its link.
      actions: write
      pull-requests: write
      # Write: one comment per run on the weekly tracking issue.
      issues: write
      # Vault login (OIDC) for the Slack bot token, to reply in the weekly Slack thread.
      id-token: write
    steps:
      - name: Checkout api-test-generator
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download the pre-agent snapshot
        uses: actions/download-artifact@v4
        with:
          name: hub-coverage-fix-pre-${{ github.run_id }}
          path: ${{ runner.temp }}/pre

      - name: Download the agent result
        id: result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hub-coverage-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/post

      # No result file means the agent left none. Verification still runs: any PR it opened is then an
      # unreported PR and fails the check.
      - name: Use an empty result when the agent left none
        if: ${{ steps.result.outcome != 'success' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/post"
          printf '{"gaps":[],"counts":{},"agent_error":true}\n' > "${RUNNER_TEMP}/post/hub-coverage-fix.json"

      # From GitHub, not from the agent: the agent holds a write token, so a file it wrote about itself proves
      # nothing. The list is every PR of the agent's account, so nothing older falls outside it. The PRs above the baseline on this run's branch pattern must fit the budget, the candidates, one
      # per area, draft, base, labels, and nothing in a dry run; every PR the agent reported must exist and none
      # may be unreported; any other PR its account opened since the baseline fails the run, whatever its branch
      # is called; and any older PR of its account that was reopened or got a commit fails it too. Other
      # automation touching its own PRs in the same minutes also fails the run, which is the safe direction. A
      # branch pushed without a PR is not covered.
      - name: Verify the PRs
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ needs.fix.outputs.baseline }}
        run: |
          set -euo pipefail
          limit=1000
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --app qa-processes --limit "$limit" \
            --json number,url,title,headRefName,baseRefName,isDraft,author,labels,state,headRefOid,body > "${RUNNER_TEMP}/run-prs.json"
          # What each of this run's PRs changed, read from GitHub: the changed files, and the two JSON files
          # the playbook allows it to touch, on the PR's base commit and on its head. The verifier checks the
          # file list and the config and floor changes against the playbook's boundaries.
          echo '{}' > "${RUNNER_TEMP}/pr-changes.json"
          for n in $(jq -r --arg run "$GITHUB_RUN_ID" \
            '.[] | select(.number > '"$BASELINE"' and (.headRefName | test("^fix/coverage-.+-" + $run + "$"))) | .number' \
            "${RUNNER_TEMP}/run-prs.json"); do
            # The base branch and its commit are read in one call, and the branch must be main: if a PR's base
            # were changed to another branch, files that exist there would drop out of the comparison.
            base_info="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" --jq '.base.ref + " " + .base.sha')"
            base_ref="${base_info%% *}"
            base_sha="${base_info#* }"
            if [ "$base_ref" != main ]; then
              echo "::error::PR #$n: its base is $base_ref, not main"
              exit 1
            fi
            # Every read below is pinned to the one head commit of the PR list snapshot (the same SHA the live
            # check is later started on), never to the PR's current head, which may have moved.
            head_sha="$(jq -r --argjson n "$n" '.[] | select(.number == $n) | .headRefOid' "${RUNNER_TEMP}/run-prs.json")"
            # Both the new path and, for a rename, the old one count: a rename from an unapproved path into an
            # approved one would otherwise look like a single allowed file.
            gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${head_sha}?per_page=100" \
              --jq '.files[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/files-${n}.txt"
            # The compare API cuts its file list at 300 entries. This list is the allowlist gate for the live
            # run, so fail closed: it must have as many files as the PR reports (the head is re-checked below),
            # and an agent PR has a handful at most.
            listed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${head_sha}?per_page=100" \
              --jq '.files | length' | awk '{n += $1} END {print n + 0}')"
            reported="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" --jq '.changed_files')"
            if [ "$listed" != "$reported" ] || [ "$listed" -gt 20 ]; then
              echo "::error::PR #$n: the changed-file list is incomplete or too long ($listed listed, $reported reported)"
              exit 1
            fi
            for side in base head; do
              sha="$base_sha"; [ "$side" = head ] && sha="$head_sha"
              for f in request-validation coverage-floors ontology/entity-kinds; do
                gh api -H "Accept: application/vnd.github.raw" \
                  "repos/${GITHUB_REPOSITORY}/contents/configs/camunda-hub/${f}.json?ref=${sha}" > "${RUNNER_TEMP}/${side}-$(basename "$f")-${n}.json"
              done
              gh api -H "Accept: application/vnd.github.raw" \
                "repos/${GITHUB_REPOSITORY}/contents/scripts/e2e/run-hub.sh?ref=${sha}" > "${RUNNER_TEMP}/${side}-run-hub-${n}.sh"
            done
            jq --arg n "$n" \
              --rawfile files "${RUNNER_TEMP}/files-${n}.txt" \
              --slurpfile brv "${RUNNER_TEMP}/base-request-validation-${n}.json" \
              --slurpfile bfl "${RUNNER_TEMP}/base-coverage-floors-${n}.json" \
              --slurpfile hrv "${RUNNER_TEMP}/head-request-validation-${n}.json" \
              --slurpfile hfl "${RUNNER_TEMP}/head-coverage-floors-${n}.json" \
              --slurpfile bek "${RUNNER_TEMP}/base-entity-kinds-${n}.json" \
              --slurpfile hek "${RUNNER_TEMP}/head-entity-kinds-${n}.json" \
              --rawfile brh "${RUNNER_TEMP}/base-run-hub-${n}.sh" \
              --rawfile hrh "${RUNNER_TEMP}/head-run-hub-${n}.sh" \
              '. + {($n): {files: ($files | split("\n") | map(select(. != ""))),
                           base: {rv: $brv[0], floors: $bfl[0], runHub: $brh, entityKinds: $bek[0]},
                           head: {rv: $hrv[0], floors: $hfl[0], runHub: $hrh, entityKinds: $hek[0]}}}' \
              "${RUNNER_TEMP}/pr-changes.json" > "${RUNNER_TEMP}/pr-changes.new" && mv "${RUNNER_TEMP}/pr-changes.new" "${RUNNER_TEMP}/pr-changes.json"
          done
          # A PR whose head moved while it was being read was not what was verified: fail instead of guessing.
          for n in $(jq -r 'keys[]' "${RUNNER_TEMP}/pr-changes.json"); do
            snap="$(jq -r --argjson n "$n" '.[] | select(.number == $n) | .headRefOid' "${RUNNER_TEMP}/run-prs.json")"
            now="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" --jq '.head.sha')"
            if [ "$snap" != "$now" ]; then
              echo "::error::PR #$n got a new commit while it was being verified ($snap -> $now)"
              exit 1
            fi
          done
          # Which fixture variables setup provisions, read at `main` through the API, never from this checkout: a
          # manual run can check out any branch, and a modified branch must not be able to change the answer.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/e2e/run-hub.sh?ref=main" > "${RUNNER_TEMP}/run-hub.sh"
          # stdout carries {violations, links}; keep it so the linking step below can read .links. On a
          # verification failure set -e stops here (the job fails and the linking step is skipped), which is
          # correct: only verified PRs get linked.
          node scripts/triage/hub-coverage-fix-verify.ts \
            "${RUNNER_TEMP}/run-prs.json" "${RUNNER_TEMP}/pre/selection.json" \
            "${RUNNER_TEMP}/post/hub-coverage-fix.json" "$GITHUB_RUN_ID" "$DRY_RUN" \
            "app/qa-processes,qa-processes[bot]" "$BASELINE" "$limit" "${RUNNER_TEMP}/pre/pre-run-prs.json" \
            "${RUNNER_TEMP}/pr-changes.json" "${RUNNER_TEMP}/run-hub.sh" \
            > "${RUNNER_TEMP}/verify-out.json"
          cat "${RUNNER_TEMP}/verify-out.json"

      # The automatic live-Hub check skips PRs from the automation account (hub-pr-live-check.yml): it would run
      # the PR's own code with Hub access before anyone had checked what the code is. Here the order is the other
      # way round. This step runs only when the step above passed: the PR is a draft from this run, within its
      # allowed files and config, and its setup lines match the allowed shapes. Only then is the same live check
      # (hub-ondemand-test.yml, run on the verified commit) started, and its link put on the PR. The result is that
      # run's status, not a check on the PR. Skipped in a dry run, which opens no PR.
      - name: Start the live Hub check on each verified PR
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ needs.fix.outputs.baseline }}
        run: |
          RUN_PRS="${RUNNER_TEMP}/run-prs.json" PR_CHANGES="${RUNNER_TEMP}/pr-changes.json" bash .github/scripts/hub-coverage-fix-live-check.sh

      # Cross-reference each verified PR with its endpoint's tracking issue: append `closes #<issue>` to the PR
      # body, which makes GitHub link the two and auto-close the endpoint issue when the PR merges. Deterministic
      # — the issue per PR comes from the verifier output, not the agent. Gated explicitly on verification passing,
      # NOT on the preceding live-check step: linking is independent, so a live-check dispatch failure must not
      # suppress it. A link failure never fails the run.
      - name: Link each verified PR to its tracking issue
        if: ${{ always() && steps.verify.outcome == 'success' && env.DRY_RUN != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/hub-coverage-fix-link-issues.sh "${RUNNER_TEMP}/verify-out.json"

      # Attribute each verified coverage-fix PR to its endpoint author (handover: a gap in an endpoint's
      # coverage belongs to whoever added the endpoint) — request their review, falling back to the
      # @camunda/hub team. The git-blame resolver needs a camunda-hub clone WITH history, so this clones
      # blobless (--filter=blob:none: full history, blobs on demand), NOT the shallow clone-hub-sibling whose
      # depth-1 blame would mis-attribute to the tip commit. Gated on verification passing, like the linking
      # step; best-effort and never fails the run.
      - name: Mint camunda-hub clone token (attribution)
        id: hub-token-attr
        if: ${{ always() && steps.verify.outcome == 'success' && env.DRY_RUN != 'true' }}
        continue-on-error: true
        uses: ./.github/actions/hub-clone-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Request the endpoint author's review on each verified PR
        if: ${{ always() && steps.verify.outcome == 'success' && env.DRY_RUN != 'true' }}
        continue-on-error: true
        env:
          # PR write on api-test-generator (request the reviewer) — the same token the linking step uses.
          GH_TOKEN: ${{ github.token }}
          # Contents:Read on camunda-hub — the resolver's commit -> login lookup and the blobless clone's
          # on-demand blob fetch during blame. May be empty if minting failed; the script then requests the
          # team for every PR using GH_TOKEN alone.
          HUB_TOKEN: ${{ steps.hub-token-attr.outputs.token }}
        run: |
          set -uo pipefail
          hub_dir="${RUNNER_TEMP}/camunda-hub"
          # Best-effort clone so the resolver can name the endpoint author. If the token is missing or the
          # clone fails, the attribution script still requests the @camunda/hub team for every PR
          # (GH_TOKEN needs no camunda-hub access), so a verified PR always ends with a reviewer — never
          # left with none.
          if [ -n "${HUB_TOKEN}" ]; then
            # A global, token-bearing insteadOf rewrite so both the clone and blame's on-demand blob fetch
            # authenticate. The runner is ephemeral and this job runs no agent, so it is torn down with it.
            git config --global \
              url."https://x-access-token:${HUB_TOKEN}@github.com/camunda/camunda-hub".insteadOf \
              "https://github.com/camunda/camunda-hub"
            # Full history (no --depth, so blame is correct), blobless to keep the clone light.
            git clone --filter=blob:none https://github.com/camunda/camunda-hub.git "$hub_dir" 2>/dev/null \
              || echo "::warning::could not clone camunda-hub — the team will be requested for every PR."
          else
            echo "::warning::no camunda-hub token — the team will be requested for every PR."
          fi
          bash .github/scripts/hub-coverage-fix-attribute.sh "${RUNNER_TEMP}/verify-out.json" "$hub_dir"

      # What the run found, for people: one comment per run on the weekly tracking issue (the full record) and one
      # reply in the weekly Slack message's thread (a line per gap). The agent's text in them is untrusted and is
      # cleaned by the script; the PR links come from GitHub. Only real runs post, and only when there is something to
      # say. None of these steps can fail the run: a missing note is a warning.
      - name: Download the weekly report
        id: weekly
        if: ${{ always() && env.DRY_RUN != 'true' && needs.fix.outputs.report_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hub-coverage-report
          path: ${{ runner.temp }}/weekly
          run-id: ${{ needs.fix.outputs.report_run_id }}
          github-token: ${{ github.token }}

      - name: Write the run report
        id: report
        if: ${{ always() && env.DRY_RUN != 'true' }}
        continue-on-error: true
        env:
          BASELINE: ${{ needs.fix.outputs.baseline }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -uo pipefail
          issue_url=""
          if [ -s "${RUNNER_TEMP}/weekly/issue-url.txt" ]; then
            candidate="$(tr -d '[:space:]' < "${RUNNER_TEMP}/weekly/issue-url.txt")"
            if printf '%s' "$candidate" | grep -qE "^https://github.com/${GITHUB_REPOSITORY}/issues/[0-9]+$"; then
              issue_url="$candidate"
            fi
          fi
          echo "issue_url=${issue_url}" >> "$GITHUB_OUTPUT"
          # The selection from the pre-agent snapshot carries the `skipped` list (eligible gaps not attempted
          # this run), so the report can name them instead of dropping them silently.
          ISSUE_URL="$issue_url" bash .github/scripts/hub-coverage-fix-report.sh \
            "${RUNNER_TEMP}/post/hub-coverage-fix.json" "${RUNNER_TEMP}/run-prs.json" \
            "${RUNNER_TEMP}/issue-comment.md" "${RUNNER_TEMP}/slack.txt" \
            "${RUNNER_TEMP}/pre/selection.json"
          if [ "$VERIFY_OUTCOME" != "success" ]; then
            for f in "${RUNNER_TEMP}/issue-comment.md" "${RUNNER_TEMP}/slack.txt"; do
              if [ -s "$f" ]; then
                printf ':warning: The verify job did not pass for this run, read it before trusting this note: %s/%s/actions/runs/%s\n\n%s\n' \
                  "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(cat "$f")" > "$f.new" && mv "$f.new" "$f"
              fi
            done
          fi

      - name: Comment on the tracking issue
        if: ${{ always() && env.DRY_RUN != 'true' && steps.report.outcome == 'success' && steps.report.outputs.issue_url != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.report.outputs.issue_url }}
        run: |
          set -euo pipefail
          [ -s "${RUNNER_TEMP}/issue-comment.md" ] || { echo "Nothing to report for the tracking issue."; exit 0; }
          num="${ISSUE_URL##*/}"
          marker="<!-- coverage-fix-run:${GITHUB_RUN_ID} -->"
          # A re-run of this job updates its comment instead of adding a second one. The marker is looked for anywhere in the
          # body: a warning about a failed verification is put in front of it.
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${num}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            comment_url="$(gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"${RUNNER_TEMP}/issue-comment.md" --jq '.html_url')"
          else
            comment_url="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${num}/comments" -F body=@"${RUNNER_TEMP}/issue-comment.md" --jq '.html_url')"
          fi
          echo "Commented on ${comment_url:-$ISSUE_URL}"
          # Point the Slack "Details" link at this run's comment (the full record), not the issue top.
          if [ -n "${comment_url:-}" ] && [ -s "${RUNNER_TEMP}/slack.txt" ]; then
            python3 -c 'import sys; p=sys.argv[3]; s=open(p).read(); open(p,"w").write(s.replace(sys.argv[1], sys.argv[2]))' \
              "$ISSUE_URL" "$comment_url" "${RUNNER_TEMP}/slack.txt"
          fi

      # The weekly report run saved its Slack message id as a small artifact of its own. A report from before that
      # existed, or a report run that did not post (a dry run), has none, and then no Slack reply is made.
      - name: Download the weekly Slack message id
        id: slack-ts-artifact
        if: ${{ always() && env.DRY_RUN != 'true' && needs.fix.outputs.report_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hub-coverage-slack-ts
          path: ${{ runner.temp }}/slack-ts
          run-id: ${{ needs.fix.outputs.report_run_id }}
          github-token: ${{ github.token }}

      - name: Check the Slack reply can be made
        id: slack-ready
        if: ${{ always() && env.DRY_RUN != 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          ts=""
          if [ -s "${RUNNER_TEMP}/slack-ts/slack-ts.txt" ]; then
            candidate="$(tr -d '[:space:]' < "${RUNNER_TEMP}/slack-ts/slack-ts.txt")"
            if printf '%s' "$candidate" | grep -qE '^[0-9]+\.[0-9]+$'; then ts="$candidate"; fi
          fi
          if [ ! -s "${RUNNER_TEMP}/slack.txt" ]; then
            echo "Nothing to report to Slack."
          elif [ -z "$ts" ]; then
            echo "::warning::No Slack message id for the weekly report run: the weekly message predates this feature or was not posted. The note was not sent to Slack."
          else
            echo "ts=${ts}" >> "$GITHUB_OUTPUT"
            {
              echo 'text<<SLACK_TEXT_EOF'
              cat "${RUNNER_TEMP}/slack.txt"
              echo 'SLACK_TEXT_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Slack bot token from Vault
        id: slack-token
        if: ${{ always() && env.DRY_RUN != 'true' && steps.slack-ready.outputs.ts != '' }}
        continue-on-error: true
        uses: ./.github/actions/slack-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Reply in the weekly Slack thread
        if: ${{ always() && env.DRY_RUN != 'true' && steps.slack-ready.outputs.ts != '' && steps.slack-token.outputs.SLACK_BOT_TOKEN != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ steps.slack-token.outputs.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#top-hub-nightly-test-results",
              "thread_ts": ${{ toJSON(steps.slack-ready.outputs.ts) }},
              "text": ${{ toJSON(steps.slack-ready.outputs.text) }},
              "mrkdwn": true
            }

  # When the selector finds no candidate but set gaps aside (all already covered, in a busy area, or known and
  # tracked), the fix job early-exits and the verify job — which posts the run report — does not run. This small
  # agent-less job posts the "not attempted" list in that case, so a week where every eligible gap is deferred is
  # not silent. It runs no agent, opens no PR, and makes no verification claim: it only reports.
  report-skipped:
    name: Report the gaps nobody attempted (no candidates this run)
    needs: fix
    if: >-
      ${{ always()
        && needs.fix.outputs.count == '0'
        && needs.fix.outputs.skipped != '0' && needs.fix.outputs.skipped != ''
        && needs.fix.outputs.report_run_id != ''
        && (github.event_name == 'workflow_run' || github.event.inputs.dry_run == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Read the report run's artifacts (download-artifact across runs) and check out this repo's scripts.
      contents: read
      actions: read
      # Write: one comment per run on the weekly tracking issue. It never opens or touches a PR.
      issues: write
      # Vault login (OIDC) for the Slack bot token, to reply in the weekly Slack thread.
      id-token: write
    steps:
      - name: Checkout api-test-generator
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the selection
        uses: actions/download-artifact@v4
        with:
          name: hub-coverage-fix-selection-${{ github.run_id }}
          path: ${{ runner.temp }}/sel

      - name: Download the weekly report
        id: weekly
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hub-coverage-report
          path: ${{ runner.temp }}/weekly
          run-id: ${{ needs.fix.outputs.report_run_id }}
          github-token: ${{ github.token }}

      - name: Write the run report
        id: report
        continue-on-error: true
        run: |
          set -uo pipefail
          issue_url=""
          if [ -s "${RUNNER_TEMP}/weekly/issue-url.txt" ]; then
            candidate="$(tr -d '[:space:]' < "${RUNNER_TEMP}/weekly/issue-url.txt")"
            if printf '%s' "$candidate" | grep -qE "^https://github.com/${GITHUB_REPOSITORY}/issues/[0-9]+$"; then
              issue_url="$candidate"
            fi
          fi
          echo "issue_url=${issue_url}" >> "$GITHUB_OUTPUT"
          # An agent-less run: no agent result and no PRs, only the selector's skipped list.
          printf '{"gaps":[]}\n' > "${RUNNER_TEMP}/empty-result.json"
          printf '[]\n' > "${RUNNER_TEMP}/empty-prs.json"
          ISSUE_URL="$issue_url" bash .github/scripts/hub-coverage-fix-report.sh \
            "${RUNNER_TEMP}/empty-result.json" "${RUNNER_TEMP}/empty-prs.json" \
            "${RUNNER_TEMP}/issue-comment.md" "${RUNNER_TEMP}/slack.txt" \
            "${RUNNER_TEMP}/sel/selection.json"

      - name: Comment on the tracking issue
        if: ${{ steps.report.outcome == 'success' && steps.report.outputs.issue_url != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.report.outputs.issue_url }}
        run: |
          set -euo pipefail
          [ -s "${RUNNER_TEMP}/issue-comment.md" ] || { echo "Nothing to report for the tracking issue."; exit 0; }
          num="${ISSUE_URL##*/}"
          marker="<!-- coverage-fix-run:${GITHUB_RUN_ID} -->"
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${num}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            comment_url="$(gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"${RUNNER_TEMP}/issue-comment.md" --jq '.html_url')"
          else
            comment_url="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${num}/comments" -F body=@"${RUNNER_TEMP}/issue-comment.md" --jq '.html_url')"
          fi
          echo "Commented on ${comment_url:-$ISSUE_URL}"
          # Point the Slack "Details" link at this run's comment (the full record), not the issue top.
          if [ -n "${comment_url:-}" ] && [ -s "${RUNNER_TEMP}/slack.txt" ]; then
            python3 -c 'import sys; p=sys.argv[3]; s=open(p).read(); open(p,"w").write(s.replace(sys.argv[1], sys.argv[2]))' \
              "$ISSUE_URL" "$comment_url" "${RUNNER_TEMP}/slack.txt"
          fi

      - name: Download the weekly Slack message id
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hub-coverage-slack-ts
          path: ${{ runner.temp }}/slack-ts
          run-id: ${{ needs.fix.outputs.report_run_id }}
          github-token: ${{ github.token }}

      - name: Check the Slack reply can be made
        id: slack-ready
        continue-on-error: true
        run: |
          set -uo pipefail
          ts=""
          if [ -s "${RUNNER_TEMP}/slack-ts/slack-ts.txt" ]; then
            candidate="$(tr -d '[:space:]' < "${RUNNER_TEMP}/slack-ts/slack-ts.txt")"
            if printf '%s' "$candidate" | grep -qE '^[0-9]+\.[0-9]+$'; then ts="$candidate"; fi
          fi
          if [ ! -s "${RUNNER_TEMP}/slack.txt" ]; then
            echo "Nothing to report to Slack."
          elif [ -z "$ts" ]; then
            echo "::warning::No Slack message id for the weekly report run: the note was not sent to Slack."
          else
            echo "ts=${ts}" >> "$GITHUB_OUTPUT"
            {
              echo 'text<<SLACK_TEXT_EOF'
              cat "${RUNNER_TEMP}/slack.txt"
              echo 'SLACK_TEXT_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Slack bot token from Vault
        id: slack-token
        if: ${{ steps.slack-ready.outputs.ts != '' }}
        continue-on-error: true
        uses: ./.github/actions/slack-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Reply in the weekly Slack thread
        if: ${{ steps.slack-ready.outputs.ts != '' && steps.slack-token.outputs.SLACK_BOT_TOKEN != '' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ steps.slack-token.outputs.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#top-hub-nightly-test-results",
              "thread_ts": ${{ toJSON(steps.slack-ready.outputs.ts) }},
              "text": ${{ toJSON(steps.slack-ready.outputs.text) }},
              "mrkdwn": true
            }
