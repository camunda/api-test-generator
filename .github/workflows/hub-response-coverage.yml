# Weekly response-coverage report for the generated camunda-hub suites.
#
# For every operation in the latest camunda-hub spec, compares the response codes the
# spec documents (2xx/400/401/403/404/409) against the status codes the generated
# suites assert, and posts the totals to #camunda-hub-nightly-test-results with the
# change since the previous report. Static analysis of generated output — it does not
# need a running Hub and cannot fail on a flaky backend. The full per-operation matrix
# is in the run summary and the `hub-coverage-report` artifact, whose `history.csv` carries
# one row of headline numbers per scheduled report so the trend can be read in one file.
#
# Deterministic: scripts/e2e/hub_response_coverage.py does the analysis; no agent.
# Same clone/Vault/Slack plumbing as hub-known-issue-reenable-check.yml. The workflow owns one
# rolling issue (exact title below): opened or rewritten each week while endpoints still lack a
# response or bad-request test, closed once nothing is missing; each API area with a gap also gets
# its own issue ("[hub-response-coverage] <Area>: missing response or bad-request tests"). The older manual epic
# camunda/api-test-generator#618 is not read or touched.
name: Hub response coverage

on:
  schedule:
    # Monday 05:00 UTC — after the 02:00 nightly, 03:00 spec-bump, 04:00 re-enable check.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      hub_ref:
        description: camunda-hub ref to audit (branch or SHA).
        default: main
      dry_run:
        description: Print the report and the Slack message, post nothing.
        type: boolean
        default: true

permissions:
  contents: read
  actions: read # download the previous run's summary for the week-over-week delta
  issues: write # open / update / close the rolling coverage-gap issue
  id-token: write # OIDC → Vault (camunda-hub clone token, Slack token)

concurrency:
  group: hub-response-coverage
  cancel-in-progress: false

env:
  ISSUE_TITLE: '[hub-response-coverage] Endpoints missing response or bad-request tests'

jobs:
  report:
    name: Audit documented vs asserted responses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Mint camunda-hub clone token
        id: hub-clone-token
        uses: ./.github/actions/hub-clone-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      # The audit measures what the nightly would run, so it audits camunda-hub's
      # latest main by default (the nightly is unpinned too), not the spec pin.
      - name: Clone camunda-hub (sibling ../camunda-hub)
        uses: ./.github/actions/clone-hub-sibling
        with:
          token: ${{ steps.hub-clone-token.outputs.token }}
          ref: ${{ inputs.hub_ref || 'main' }}

      - name: Bundle spec and generate both suites
        run: |
          CONFIG=camunda-hub npm run fetch-spec
          CONFIG=camunda-hub npm run testsuite:generate
          CONFIG=camunda-hub npm run generate:request-validation

      - name: Resolve audited camunda-hub commit
        id: hub-sha
        run: echo "sha=$(git -C ../camunda-hub rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Baseline = the previous *scheduled* report, so a dry-run dispatch or a run against another
      # hub_ref never becomes the comparison point. No earlier run (the first one) or one old
      # enough that its artifact has expired is fine: the history simply starts here. A run that
      # should still have its artifact but cannot be downloaded is NOT fine: carrying on would
      # replace the accumulated history.csv with a one-row file that every later run inherits, so
      # retry and then fail the run (a re-run recovers; a silent reset cannot be undone).
      - name: Fetch previous report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # A failed lookup is not "no previous run": only an empty answer is.
          if ! prev=$(gh run list --workflow hub-response-coverage.yml --event schedule \
            --status success --limit 1 --json databaseId,createdAt \
            --jq '.[0] | select(. != null) | "\(.databaseId) \(.createdAt)"'); then
            echo "::error::Could not list previous reports. Failing instead of restarting history.csv."
            exit 1
          fi
          read -r prev_id prev_date <<< "$prev"
          if [ -z "${prev_id:-}" ]; then
            echo "No previous scheduled report: the history starts with this run."
            exit 0
          fi
          age_days=$(( ( $(date +%s) - $(date -d "$prev_date" +%s) ) / 86400 ))
          # Artifact retention is 90 days; leave a margin so a near-expiry artifact is not a failure.
          if [ "$age_days" -ge 85 ]; then
            echo "::warning::Previous scheduled report is $age_days days old and its artifact has likely expired: the history restarts with this run."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh run download "$prev_id" --name hub-coverage-report --dir previous; then
              break
            fi
            echo "Download of the previous report failed (attempt $attempt of 3)."
            sleep $((attempt * 10))
          done
          if [ ! -f previous/summary.json ]; then
            echo "::error::Could not download the previous report (run $prev_id, $age_days days old). Failing instead of restarting history.csv; re-run once GitHub artifacts are reachable."
            exit 1
          fi
          # The previous run predates history.csv (first run after this feature shipped): start it here.
          [ -f previous/history.csv ] || echo "Previous report has no history.csv: the history starts with this run."

      - name: Run the audit
        run: |
          python3 scripts/e2e/hub_response_coverage.py \
            --out coverage-report \
            --previous previous/summary.json \
            --previous-history previous/history.csv \
            --spec-ref "${{ steps.hub-sha.outputs.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Same gate as Slack: a dry run or a test trigger never touches issues. An existing open
      # issue is rewritten in place (never a second one); an empty issue.md means nothing is
      # missing, so the open issue is closed. The issue URL goes into the Slack message.
      - name: Open, update or close the coverage-gap issue
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: coverage-report
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/hub-coverage-summary-issue.sh

      # One issue per API area (the spec's first tag) that has a gap, same rules as the summary issue:
      # found by exact title in any state, rewritten in place, reopened if the gap returns, closed when
      # the area is clean. At most MAX_NEW_AREA_ISSUES brand-new issues per run so the first run cannot
      # flood the repo; the rest follow on later Mondays (the summary issue lists every gap meanwhile).
      - name: Open, update or close the per-area issues
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_NEW_AREA_ISSUES: '10'
          REPORT_DIR: coverage-report
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/hub-coverage-area-issues.sh

      - name: Render report page
        run: python3 scripts/e2e/hub_coverage_page.py --report coverage-report

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: hub-coverage-report
          path: coverage-report/
          retention-days: 90

      - name: Write job summary
        run: cat coverage-report/history.md coverage-report/matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch Slack bot token from Vault
        id: slack
        # Only a scheduled run or a non-dry dispatch may post; anything else (a dry run,
        # a test trigger) stays out of the channel.
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        continue-on-error: true
        uses: ./.github/actions/slack-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Build Slack message
        id: message
        if: always() && steps.slack.outputs.SLACK_BOT_TOKEN != ''
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            text="$(cat coverage-report/slack.txt)"
            if [ -s coverage-report/issue-url.txt ]; then
              text="$text"$'\n'"<$(cat coverage-report/issue-url.txt)|Tracking issue>"
            fi
            if [ -s coverage-report/area-links.txt ]; then
              text="$text"$'\n'"Area issues: $(paste -sd'\t' coverage-report/area-links.txt | sed 's/\t/ · /g')"
            fi
          else
            text=":warning: *camunda-hub response coverage* could not run this week — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          {
            echo 'text<<SLACK_MESSAGE_EOF'
            echo "$text"
            echo 'SLACK_MESSAGE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always() && steps.message.outcome == 'success'
        continue-on-error: true
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ steps.slack.outputs.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#camunda-hub-nightly-test-results",
              "text": ${{ toJSON(steps.message.outputs.text) }},
              "mrkdwn": true
            }
