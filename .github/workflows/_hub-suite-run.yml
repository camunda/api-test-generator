# Reusable hub-suite run (workflow_call). The shared body behind every "generate
# the hub suite + run it against a live Hub" entry point — the on-demand test
# (hub-ondemand-test.yml) and the PR check (hub-pr-check.yml, #462) both call it,
# so the orchestration lives in ONE place. Bundles the spec from ../camunda-hub @
# `hub_ref` and runs the `hub_image` container via the prebuilt path, with the
# keycloak/identity/db this repo provisions (we control auth). Results → run
# summary + uploaded Playwright reports.
name: _hub-suite-run

on:
  workflow_call:
    inputs:
      hub_ref:
        description: camunda-hub ref/SHA to clone + bundle the spec from.
        type: string
        default: main
      hub_image:
        description: >-
          Full Hub image ref to run (e.g. camunda/hub:SNAPSHOT, or the internal
          PR image registry.camunda.cloud/team-hub/hub-restapi-self-managed:pr-<sha>,
          which is the same artifact published as camunda/hub).
        type: string
        default: camunda/hub:SNAPSHOT
      summary_heading:
        description: Markdown heading block for the run summary.
        type: string
        required: true
      hub_registry:
        description: >-
          Optional container registry host to `docker login` before pulling
          hub_image (e.g. registry.camunda.cloud for the private
          hub-restapi-self-managed:pr-<sha> image). Leave empty for public
          camunda/hub. When set, it must be on HUB_REGISTRY_ALLOWLIST, hub_image
          must be under HUB_IMAGE_ALLOWLIST, and REGISTRY_USERNAME/PASSWORD must
          be provided.
        type: string
        default: ''
    outputs:
      unmapped_operations:
        description: >-
          Comma-separated operationIds with zero generated test coverage
          (empty if none). coverage.json itself isn't in the uploaded
          hub-suite-reports artifact (a different directory), so a caller
          needing this — e.g. hub-pr-check.yml's classify step, to tell a
          real regression apart from "the generator hasn't modelled this
          new/changed operation yet" — reads it from here instead.
        value: ${{ jobs.run.outputs.unmapped_operations }}
      unmapped_checked:
        description: >-
          "true" if coverage.json was successfully read and parsed this run
          (regardless of whether unmapped_operations came back empty or
          not), "false" if that read/parse itself failed. An empty
          unmapped_operations is ambiguous on its own — it means EITHER
          "confirmed zero unmapped operations" OR "couldn't check at all" —
          so a caller that treats empty as "gap cleared" (e.g.
          hub-pr-check.yml's coverage-gap-tracker, auto-closing a tracking
          issue) must check this first to avoid acting on unverified data.
        value: ${{ jobs.run.outputs.unmapped_checked }}
      suites_conclusion:
        description: >-
          The generate+run step's own conclusion (success/failure/…),
          independent of the overall job result. The "Fail if any operation
          has no generated test coverage" step below deliberately fails this
          JOB whenever unmapped_operations is non-empty (so a manual
          hub-ondemand-test.yml run shows red, matching #505's intent) — but
          a caller that wants to distinguish "the suite itself passed, only
          the coverage-check step failed" from "there's a genuine test
          failure" (hub-pr-check.yml, #480: a pure coverage gap must not be
          REPORTED as a failing check on the camunda-hub PR) needs this
          finer-grained signal, since the job's own aggregate result alone
          can't tell the two apart.
        value: ${{ jobs.run.outputs.suites_conclusion }}
    # Declared explicitly (not `inherit`) so the interface is least-privilege and
    # callers can't accidentally omit one. Used by the hub-clone-token action.
    secrets:
      VAULT_ADDR:
        required: true
      VAULT_JWT_PATH:
        required: true
      VAULT_JWT_ROLE:
        required: true
      VAULT_JWT_AUDIENCE:
        required: true
      # Only needed when hub_registry is set (private pr-<sha> image pulls).
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write # OIDC → Vault for the camunda-hub clone token

env:
  CONFIG: camunda-hub
  HUB_UI_PORT: '8088'
  KEYCLOAK_PORT: '18080'
  # Registries the login step is allowed to send credentials to. hub_registry
  # can arrive from an external repository_dispatch payload (hub-pr-check), so
  # it is validated against this allowlist before `docker login` to prevent
  # credential exfiltration to an attacker-controlled host. Space-separated.
  HUB_REGISTRY_ALLOWLIST: registry.camunda.cloud
  # Image repository prefixes we're willing to pull + run when a registry is set.
  # Pinned to the specific Hub PR image repo (the restapi-self-managed component
  # is the same artifact published as camunda/hub) — not the whole team-hub org —
  # so a crafted payload can't run some other team-hub image with these creds.
  # Space-separated.
  HUB_IMAGE_ALLOWLIST: 'registry.camunda.cloud/team-hub/hub-restapi-self-managed:'

jobs:
  run:
    name: Generate + run hub suites (${{ inputs.hub_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      unmapped_operations: ${{ steps.unmapped.outputs.unmapped }}
      unmapped_checked: ${{ steps.unmapped.outputs.unmapped_checked }}
      suites_conclusion: ${{ steps.suites.conclusion }}
    steps:
      - name: Checkout api-test-generator
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Mint camunda-hub clone token
        id: hub-token
        uses: ./.github/actions/hub-clone-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      - name: Clone camunda-hub @ ${{ inputs.hub_ref }} (sibling ../camunda-hub)
        uses: ./.github/actions/clone-hub-sibling
        with:
          token: ${{ steps.hub-token.outputs.token }}
          ref: ${{ inputs.hub_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      # Only for a private image (e.g. the PR check's internal pr-<sha>); skipped
      # for public camunda/hub. Uses --password-stdin (no token in argv/logs).
      - name: Log in to the Hub image registry
        if: inputs.hub_registry != ''
        env:
          REGISTRY: ${{ inputs.hub_registry }}
          HUB_IMAGE: ${{ inputs.hub_image }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          # hub_image can come from an untrusted dispatch payload. Require a single
          # well-formed image reference (no whitespace/control chars) before it's
          # matched, logged, or handed to docker/compose downstream.
          # :tag is required (not optional) so this stays consistent with the
          # tag-prefixed HUB_IMAGE_ALLOWLIST below and the PR-image format.
          if [ "$(printf '%s' "$HUB_IMAGE" | wc -l)" -ne 0 ] \
             || ! printf '%s' "$HUB_IMAGE" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*:[A-Za-z0-9._-]+(@sha256:[a-f0-9]+)?$'; then
            echo "::error::hub_image='$HUB_IMAGE' is not a well-formed single image reference (repo:tag required)."
            exit 1
          fi
          # Only send credentials to an allowlisted host — hub_registry may come
          # from an untrusted dispatch payload. Reject anything else.
          allowed=false
          for r in $HUB_REGISTRY_ALLOWLIST; do
            [ "$REGISTRY" = "$r" ] && allowed=true
          done
          if [ "$allowed" != true ]; then
            echo "::error::hub_registry='$REGISTRY' is not in the allowlist ($HUB_REGISTRY_ALLOWLIST)."
            exit 1
          fi
          # The image must live under an allowlisted repository path (not just the
          # allowlisted registry) — limits blast radius and catches crafted payloads.
          image_ok=false
          for p in $HUB_IMAGE_ALLOWLIST; do
            case "$HUB_IMAGE" in "$p"*) image_ok=true ;; esac
          done
          if [ "$image_ok" != true ]; then
            echo "::error::hub_image='$HUB_IMAGE' is not under an allowed path ($HUB_IMAGE_ALLOWLIST)."
            exit 1
          fi
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::hub_registry=$REGISTRY set but REGISTRY_USERNAME/PASSWORD not provided."
            exit 1
          fi
          # Retry to absorb a transient registry blip ("Get https://…/v2/:
          # net/http: request canceled while waiting for connection") — same
          # reason the compose pull in docker/start-hub.sh retries. `timeout`
          # bounds an attempt that hangs past docker's own client timeout.
          # A credential/permission error is not retry-fixable, but it fails
          # identically on every attempt, so the job still goes red.
          login_attempts=0
          until printf '%s' "$REGISTRY_PASSWORD" \
            | timeout 60 docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin; do
            login_attempts=$((login_attempts + 1))
            if [ "$login_attempts" -ge 3 ]; then
              echo "::error::docker login to '$REGISTRY' failed after ${login_attempts} attempts."
              exit 1
            fi
            echo "docker login failed — retry ${login_attempts}/3 in $((login_attempts * 10))s..."
            sleep $((login_attempts * 10))
          done

      - name: Start Hub (prebuilt image)
        env:
          HUB_MODE: prebuilt
          # Full image ref (registry + repo + tag); docker-compose.hub.yml reads it.
          HUB_IMAGE: ${{ inputs.hub_image }}
        run: ./docker/start-hub.sh start

      - name: Wait for Hub to be ready
        uses: ./.github/actions/wait-for-hub
        with:
          url: http://localhost:${{ env.HUB_UI_PORT }}/api/v2/

      # run-hub.sh's generate step auto-re-bundles from the sibling cloned at
      # hub_ref (SKIP_BUNDLE unset), so the generated suite matches the ref under
      # test — no separate bundle step needed.
      - name: Generate + run positive + negative suites
        id: suites
        env:
          STEPS: generate run
          RV_PROFILES: secured rbac
        run: ./scripts/e2e/run-hub.sh

      # An unmapped operation is a SILENT skip, not a generate failure (see
      # AGENTS.md → "Coverage has two axes") — the materializer records it in
      # coverage.json but never fails generate on it, so a run with a
      # genuinely new/changed spec operation the generator can't model yet
      # would otherwise stay fully green here (every generated test still
      # passes; there's just no test at all for the new one). hub-run-summary
      # below already surfaces this as a non-blocking ⚠️ note in the job
      # summary, easy to miss — this makes it an actual failure instead, so
      # callers (hub-pr-check.yml in particular, run on every camunda-hub PR)
      # catch a coverage gap on the PR that introduced it rather than a day
      # later via the separate spec-bump tracking issue. `if: always()`: run
      # this even if the suite run above already failed for an unrelated
      # reason, so both signals surface together instead of one hiding the other.
      # Gated on the suite step not being SKIPPED, though: if the job died before
      # generate ever ran (registry login, Hub startup), coverage.json cannot
      # exist and this would add a spurious second ::error:: that buries the real
      # cause in the summary and misleads hub-pr-check's classify step.
      - name: Fail if any operation has no generated test coverage
        id: unmapped
        if: always() && steps.suites.conclusion != 'skipped'
        run: |
          set -euo pipefail
          # A read/parse failure (missing file, corrupt JSON) is NOT the same
          # as "no unmapped operations" — the old `2>/dev/null || true` swallowed
          # both identically and would have printed a false "clean" message even
          # when coverage.json was missing/broken (e.g. an earlier crash). This
          # step's whole point is to be a trustworthy gate, so a read/parse
          # failure now fails loudly and distinctly instead.
          # operationIds ultimately come from the camunda-hub PR's own
          # (untrusted) OpenAPI spec — strip any embedded control character
          # (newline/CR/tab) before joining, so a crafted operationId can't
          # inject a literal newline into this single-line output (every
          # downstream consumer — hub-pr-check.yml's commit-status
          # description, Slack messages, the coverage-gap-tracker issue body
          # — assumes this is one line).
          unmapped_script='
          import json, re, sys
          try:
              with open("generated/camunda-hub/playwright/coverage.json") as f:
                  data = json.load(f)
          except Exception as e:
              print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(2)
          ops = data.get("summary", {}).get("unmappedOperations", [])
          clean = (re.sub(r"[\r\n\t]+", " ", str(op)).strip() for op in ops)
          print(", ".join(clean))
          '
          if ! unmapped="$(python3 -c "$unmapped_script")"; then
            echo "::error::Could not read/parse generated/camunda-hub/playwright/coverage.json — treating this as a coverage-check failure rather than silently assuming there are no unmapped operations."
            echo "unmapped=" >> "$GITHUB_OUTPUT"
            # Distinct from "confirmed zero unmapped operations" below — a
            # caller (hub-pr-check.yml's coverage-gap-tracker) that sees an
            # empty `unmapped` must be able to tell "verified clean" apart
            # from "couldn't verify at all," so it doesn't e.g. auto-close a
            # still-relevant tracking issue on unverified data.
            echo "unmapped_checked=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "unmapped=${unmapped}" >> "$GITHUB_OUTPUT"
          echo "unmapped_checked=true" >> "$GITHUB_OUTPUT"
          if [ -n "$unmapped" ]; then
            echo "::error::Coverage gap: operation(s) with no generated test at all: ${unmapped}. This is not a Playwright failure — the generator's ontology/scenario-templates don't model this operation yet (see AGENTS.md → \"Coverage has two axes\")."
            exit 1
          fi
          echo "No unmapped (uncovered) operations."

      - name: Stop Hub
        if: always()
        run: ./docker/start-hub.sh stop || true

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-suite-reports
          path: test-results/e2e-camunda-hub/
          retention-days: 14

      - name: Write results to run summary
        if: always()
        uses: ./.github/actions/hub-run-summary
        with:
          heading: ${{ inputs.summary_heading }}
