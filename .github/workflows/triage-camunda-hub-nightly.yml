# description: Triage agent for the camunda-hub nightly API test run. Fires when
#              "Nightly — camunda-hub API tests" completes, downloads its
#              camunda-hub-nightly-reports artifact (JSON/JUnit + HTML report +
#              traces/screenshots/coverage.json), spins up a 3-repo workspace
#              (api-test-generator, camunda-docs, camunda-hub @ main) via
#              workspace-cli, and runs a Claude Code triage agent. The agent debugs
#              each positive + negative failure (plus unmapped-operation coverage
#              gaps from coverage.json), classifies failures product / infrastructure
#              / flakiness, cross-checks the camunda-hub OpenAPI spec + recent commits
#              (skipping bugs explained by a recent change). Write access is
#              asymmetric: camunda-hub gets issues only (never code); api-test-
#              generator may get a PR for a confirmed test-generation bug or a
#              coverage gap with an obvious minimal fix. Posts a triaged digest to
#              #camunda-hub-nightly-test-results.
# type: CI
# owner: @camunda/test-automation-team
---
name: Triage — camunda-hub nightly API failures

on:
  # Auto-run when the nightly test workflow finishes (any conclusion — a green
  # night is still reported). The `name:` here must match nightly-camunda-hub.yml.
  workflow_run:
    workflows: ["Nightly — camunda-hub API tests"]
    types: [completed]
  # Ad-hoc: triage a specific past nightly run.
  workflow_dispatch:
    inputs:
      nightly_run_id:
        description: 'Run ID of a "Nightly — camunda-hub API tests" run to triage (with the camunda-hub-nightly-reports artifact).'
        required: true
      slack_channel:
        description: 'Slack channel to post to (name or ID). Override for test runs.'
        default: '#camunda-hub-nightly-test-results'
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  # OIDC token so Vault can authenticate this job via JWT (no long-lived secrets).
  id-token: write
  # Read the triggering run's artifacts (download-artifact across runs).
  actions: read
  # An explicit `permissions:` block replaces the default token scope entirely
  # — without this, `gh pr list`/`gh pr diff` in "Discover open fix PRs" (which
  # uses github.token, not the qa-processes App) would 403 and silently
  # degrade to an empty open-fix-prs.json, defeating the dedup guardrail.
  pull-requests: read

# Never overlap two triage runs.
concurrency:
  group: triage-camunda-hub
  cancel-in-progress: false

env:
  CONFIG: camunda-hub
  SLACK_CHANNEL: ${{ github.event.inputs.slack_channel || '#camunda-hub-nightly-test-results' }}
  # Where the downloaded nightly reports land (exported to the agent as $REPORTS_DIR).
  REPORTS_DIR: ${{ github.workspace }}/hub-reports

jobs:
  triage:
    name: Download reports → workspace → Claude triage → Slack
    runs-on: ubuntu-latest
    # 30 -> 45: #482's live curl-replay verification adds a full Hub pull +
    # boot (up to 10 min per wait-for-hub's own default timeout) on any
    # night with negative-suite failures, on top of everything this job
    # already does.
    timeout-minutes: 45
    # workflow_run has no branch/origin filter by itself — it fires after ANY
    # completed run of a workflow with this name, including one dispatched
    # (nightly-camunda-hub.yml has workflow_dispatch: {}, unrestricted) against
    # a feature branch or a fork. This job always runs with production
    # secrets, so only proceed for an explicit workflow_dispatch (a human
    # already asked for this) or a workflow_run whose underlying nightly ran
    # on `main` in this same repo — never someone else's branch/fork's ad-hoc
    # nightly dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout api-test-generator
        uses: actions/checkout@v6
        with:
          # Short-lived GITHUB_TOKEN must not linger in .git/config — the private
          # camunda-hub clone uses the Vault-issued App token configured below.
          persist-credentials: false

      # --- Resolve which nightly run to triage --------------------------------
      # workflow_run → the run that triggered us; workflow_dispatch → the input.
      - name: Resolve nightly run id
        id: nightly
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ github.event.inputs.nightly_run_id }}
        run: |
          set -euo pipefail
          run_id="${INPUT_RUN_ID:-$EVENT_RUN_ID}"
          if [ -z "$run_id" ]; then
            echo "::error::No nightly run id (neither workflow_run event nor input)."; exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${run_id}" >> "$GITHUB_OUTPUT"
          echo "Triaging nightly run ${run_id}"

      # --- Download the nightly reports artifact ------------------------------
      # The artifact lives on the triggering run in THIS repo, so github.token
      # (actions: read) suffices. Contains pw-{positive,secured,rbac}.{json,junit.xml}
      # plus the HTML report dirs with traces/screenshots (failures only).
      # continue-on-error: a missing artifact (nightly crashed before its always()
      # upload) must NOT hard-fail the job — we detect it below and report it as
      # inconclusive rather than dying silently or implying a green night.
      - name: Download camunda-hub-nightly-reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: camunda-hub-nightly-reports
          path: ${{ env.REPORTS_DIR }}
          run-id: ${{ steps.nightly.outputs.run_id }}
          github-token: ${{ github.token }}

      # No-false-all-clear: a triage with no report data must announce itself as
      # inconclusive, never post a green digest. has_reports gates the agent step.
      - name: Check reports present
        id: reports
        run: |
          set -euo pipefail
          echo "REPORTS_DIR=${REPORTS_DIR}"
          # download-artifact may not create this directory at all if the
          # artifact was totally missing (continue-on-error just swallows that
          # failure) — mkdir -p first so `find` below has something to search
          # instead of erroring out and killing this step under pipefail.
          mkdir -p "${REPORTS_DIR}"
          find "${REPORTS_DIR}" -maxdepth 2 -type f 2>/dev/null | head -50 || true
          # Neutralize find's own exit code INSIDE the subshell, at the
          # source, rather than a trailing `|| echo 0` on the whole
          # substitution: if find fails after already emitting some paths
          # (e.g. a permission error partway through), pipefail would still
          # make the outer pipe's status non-zero even though wc/tr both
          # succeeded — and `|| echo 0` would then APPEND "0" after the
          # count wc already produced, making $count a two-line, non-numeric
          # value that breaks the -gt comparison below.
          # Either report format is sufficient signal to triage — a partial
          # reporter write (e.g. JSON write interrupted, JUnit already
          # flushed) shouldn't be treated as "nothing to triage" when real
          # data exists in the other format.
          count=$( (find "${REPORTS_DIR}" -maxdepth 2 \( -name 'pw-*.json' -o -name 'pw-*.junit.xml' \) 2>/dev/null || true) | wc -l | tr -d ' ')
          if [ "${count}" -gt 0 ]; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No pw-*.json or pw-*.junit.xml reports found (download outcome: ${{ steps.download.outcome }}). Reporting as inconclusive."
          fi

      # --- #482: live curl-replay verification of negative-suite failures ----
      # Before the agent ever classifies a failure as a genuine product bug,
      # give it one more piece of evidence: does the exact same request still
      # get the same (wrong) response RIGHT NOW, against a fresh Hub — or has
      # it since been fixed / was it flaky? Runs for EVERY negative-suite
      # failure (not just eventual "looks like a product bug" candidates —
      # nothing here knows which ones look like bugs yet, that's the agent's
      # job), against ONE freshly-started Hub, so the live-Hub cost is
      # bounded to once per night regardless of how many candidates appear.
      #
      # Positive-suite failures aren't covered — materializer/templates has
      # no evidence-capture mechanism at all (unlike request-validation's
      # request.json/response.json testInfo.attach()ments), so there is
      # nothing to reconstruct a request from there yet. Tracked as a
      # follow-up once that instrumentation exists.
      - name: Check for negative-suite failures worth verifying
        id: neg-failures
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        run: |
          set -euo pipefail
          count=0
          for f in "${REPORTS_DIR}/pw-secured.json" "${REPORTS_DIR}/pw-rbac.json"; do
            [ -f "$f" ] || continue
            n=$(jq -r '.stats.unexpected // 0' "$f" 2>/dev/null || echo 0)
            count=$((count + n))
          done
          echo "Negative-suite unexpected-result count: ${count}"
          if [ "$count" -gt 0 ]; then
            echo "has_negative_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_negative_failures=false" >> "$GITHUB_OUTPUT"
          fi

      # No camunda-hub clone needed here: HUB_MODE=prebuilt (the "Start Hub"
      # step below) runs a published DOCKER IMAGE, not a source build —
      # docker/start-hub.sh's own source-build path is the only one that
      # touches the ../camunda-hub sibling (for `make`/a JDK/the local-bundle
      # spec source), and that path is never taken here. continue-on-error
      # on every step below: a failure anywhere in this verification chain
      # must degrade to "no verification data" (handled by the guidance doc
      # below), never fail the whole triage run.
      - name: Setup Python (for live verification)
        if: ${{ steps.reports.outputs.has_reports == 'true' && steps.neg-failures.outputs.has_negative_failures == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Public image, no registry login needed (unlike hub-pr-check.yml's
      # private pr-<sha> image) — same defaults hub-ondemand-test.yml uses.
      - name: Start Hub (prebuilt image, for live verification)
        id: verify-hub-start
        if: ${{ steps.reports.outputs.has_reports == 'true' && steps.neg-failures.outputs.has_negative_failures == 'true' }}
        continue-on-error: true
        env:
          HUB_MODE: prebuilt
          HUB_IMAGE: camunda/hub:SNAPSHOT
        run: ./docker/start-hub.sh start

      - name: Wait for Hub to be ready (live verification)
        if: ${{ steps.reports.outputs.has_reports == 'true' && steps.neg-failures.outputs.has_negative_failures == 'true' && steps.verify-hub-start.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/wait-for-hub
        with:
          url: http://localhost:8088/api/v2/

      - name: Run curl-replay verification
        if: ${{ steps.reports.outputs.has_reports == 'true' && steps.neg-failures.outputs.has_negative_failures == 'true' }}
        continue-on-error: true
        run: |
          python3 scripts/e2e/verify-negative-failures.py \
            --reports-dir "${REPORTS_DIR}" \
            --base-url http://localhost:8088/api \
            --kc-url http://localhost:18080/auth/realms/camunda-platform/protocol/openid-connect/token \
            --out "${GITHUB_WORKSPACE}/curl-verification.json"

      # Runs regardless of which prior step failed/was skipped — the agent's
      # guidance treats a missing/empty file as "verification unavailable,"
      # so this just guarantees the path always exists to read.
      - name: Ensure curl-verification.json exists
        if: always()
        run: |
          f="${GITHUB_WORKSPACE}/curl-verification.json"
          [ -s "$f" ] || echo '{}' > "$f"

      - name: Stop Hub (live verification)
        if: ${{ always() && steps.verify-hub-start.outcome == 'success' }}
        run: ./docker/start-hub.sh stop || true

      # --- Secrets from Vault (GitHub OIDC/JWT) -------------------------------
      # Anthropic key + a GitHub PAT, from the SAME Vault KV path this repo's
      # nightly already reads (SLACK_BOT_USER_OAUTH_TOKEN + TESTRAIL_*), so no
      # new policy is needed — KV v2 read is path-level. Key names match what
      # lives at qa/ci/common: CLAUDE_API_KEY, GH_TOKEN. (GitHub *writes* use
      # the qa-processes App tokens below, not this PAT — it exists solely to
      # authenticate the workspace-cli install below, see that step's comment.
      # Required, so a genuinely-missing key fails loudly.
      - name: Fetch Anthropic key + GitHub PAT from Vault
        id: vault
        # Only the agent needs these, and the agent only runs when has_reports
        # is true (see below) — gating it here too means a Vault hiccup on a
        # no-reports night can't hard-fail the job before it reaches the
        # inconclusive-result write.
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/qa/ci/common CLAUDE_API_KEY | ANTHROPIC_API_KEY ;
            secret/data/products/qa/ci/common GH_TOKEN | GH_PAT ;

      # Two separately-scoped GitHub App tokens — the agent's write access is
      # asymmetric by design (camunda-hub: issues only; api-test-generator: may
      # open a PR for a confirmed test-generation/coverage fix), so each repo
      # gets its own token rather than one broad grant. Same App + Vault wiring
      # as spec-bump-check.yml and the stale-PR janitor in both cases.
      # continue-on-error: if the App can't reach a repo, that token is empty
      # and the agent degrades to report-only for that repo (Slack still
      # surfaces the bug) rather than failing the run.
      - name: Generate qa-processes App token (camunda-hub issues)
        id: qa-token-hub
        continue-on-error: true
        # Pinned SHA — same pin as spec-bump-check.yml + the janitor. Bump intentionally.
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@7a9c6f3e477321400802c88290068f88a7ed5684
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: camunda-hub

      # Same App, scoped to api-test-generator instead — this is the SAME grant
      # (contents:write + pull-requests:write) spec-bump-check.yml's bump-PR
      # token already uses successfully on this repo (e.g. the chore/spec-bump-*
      # PRs), so opening a fix PR here needs no new App permission.
      - name: Generate qa-processes App token (api-test-generator fix PRs)
        id: qa-token-generator
        continue-on-error: true
        uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@7a9c6f3e477321400802c88290068f88a7ed5684
        with:
          github-app-id-vault-key: GITHUB_APP_ID
          github-app-id-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          github-app-private-key-vault-key: GITHUB_APP_SECRET
          github-app-private-key-vault-path: secret/data/products/qa/ci/github.com/apps/camunda/qa-processes
          vault-auth-method: approle
          vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
          vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
          vault-url: ${{ secrets.VAULT_ADDR }}
          owner: camunda
          repositories: api-test-generator

      # Best-effort label pre-creation, deterministic bash (not left to the
      # agent's own retry-on-error, which is fuzzier). kind/bug already exists
      # on camunda-hub; nightly-detected and nightly-api-fix don't yet.
      - name: Ensure labels exist (camunda-hub)
        if: ${{ steps.qa-token-hub.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.qa-token-hub.outputs.token }}
        run: |
          gh label create kind/bug --repo camunda/camunda-hub --color d73a4a --description "A confirmed defect" 2>/dev/null || true
          gh label create nightly-detected --repo camunda/camunda-hub --color 5319e7 --description "Filed by the camunda-hub nightly API triage agent" 2>/dev/null || true
          # The agent never opens a PR here (issues only), but a human fixing a
          # filed issue is asked to carry this label — pre-create it so the
          # close-stale-nightly-api-fix-prs janitor's camunda-hub leg (and the
          # human) find it ready.
          gh label create nightly-api-fix --repo camunda/camunda-hub --color FF4444 --description "Human fix PR for a nightly-detected camunda-hub issue" 2>/dev/null || true

      - name: Ensure labels exist (api-test-generator)
        if: ${{ steps.qa-token-generator.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.qa-token-generator.outputs.token }}
        run: |
          gh label create nightly-api-fix --repo camunda/api-test-generator --color FF4444 --description "Bot-opened fix PR for a nightly triage finding (test-generation bug or coverage gap)" 2>/dev/null || true

      - name: Fetch Slack bot token from Vault
        id: slack
        continue-on-error: true
        uses: ./.github/actions/slack-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      # Clone token for the private camunda-hub (Contents:Read). A single git
      # `insteadOf` with this App installation token clones camunda-hub AND the two
      # public repos (installation tokens can read public repos), so workspace-cli
      # resolves all three from the manifest without extra creds.
      - name: Mint camunda-hub clone token
        id: hub-token
        # Only needed to clone camunda-hub for the agent's workspace, which
        # only happens when has_reports is true — same reasoning as the
        # Anthropic key fetch above.
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        uses: ./.github/actions/hub-clone-token
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          vault-jwt-path: ${{ secrets.VAULT_JWT_PATH }}
          vault-jwt-role: ${{ secrets.VAULT_JWT_ROLE }}
          vault-jwt-audience: ${{ secrets.VAULT_JWT_AUDIENCE }}

      # --- Toolchain ----------------------------------------------------------
      # 'stable' (not a pinned major) — the exact Go version isn't part of this
      # workflow's deterministic behavior (workspace-cli itself is already
      # pinned to a commit SHA below), so tracking stable avoids running an
      # EOL, security-fix-less toolchain that a hardcoded version would drift
      # into over time.
      # Only needed to build the agent's workspace, which only happens when
      # has_reports is true — gated the same as the token/credential steps
      # above, so a no-reports night can't hard-fail here either.
      - name: Setup Go (for workspace-cli)
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Node.js 22 (for Claude Code CLI)
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Pinned to a commit SHA (workspace-cli has no tagged releases) rather
      # than @latest, so an upstream breaking change can't silently start
      # failing nightly triage — bump intentionally. SHA = camunda/
      # workspace-cli main HEAD @ 2026-07-15.
      #
      # workspace-cli is ITSELF a private repo (a separate concern from "which
      # repos workspace-cli clones" — the "Configure git credentials for
      # cloning" step below, for camunda-hub) — go install's checksum lookup
      # against sum.golang.org 404s for a private module, and it then falls
      # back to an unauthenticated `git ls-remote`, which fails outright. Two
      # things fix this, matching the same pattern the c8-orchestration-
      # cluster-e2e-nightly-fix.yml reference this agent is modeled on
      # already uses: GOPRIVATE tells Go to skip the public checksum lookup
      # entirely for camunda/*, and a repo-specific insteadOf authenticates
      # the actual git fetch with the Vault-issued PAT — the qa-processes App
      # token can't be used here, it has no grant on this repo.
      - name: Install workspace-cli
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        env:
          GOPRIVATE: github.com/camunda/*
          GH_PAT: ${{ steps.vault.outputs.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_PAT" ]; then
            echo "::error::No GitHub PAT from Vault — cannot authenticate the private workspace-cli module fetch."
            exit 1
          fi
          # Scoped, temporary gitconfig for this credential only — NOT the
          # persistent $HOME/.gitconfig the later camunda-hub clone rewrite
          # uses. If `go install` fails (or anything else in this step does),
          # the trap still removes it: the PAT can never outlive this one
          # step, regardless of exit status, and never needs the later
          # "Scrub git credentials" step to find and remove it.
          GIT_CONFIG_GLOBAL="$(mktemp)"
          export GIT_CONFIG_GLOBAL
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          git config --global url."https://x-access-token:${GH_PAT}@github.com/camunda/workspace-cli".insteadOf "https://github.com/camunda/workspace-cli"
          go install github.com/camunda/workspace-cli/cmd/workspace@e1b3f19dd244957db5eb3b4ebd5bc71999c3deb0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Pinned version (same as the c8-orchestration-cluster-e2e-nightly-fix.yml
      # reference this agent is modeled on) — bump intentionally.
      - name: Install Claude Code CLI
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.156
          claude --version

      # Only camunda-hub needs a clone rewrite: it's the one private repo, and
      # the ONLY thing cloning needs. camunda-docs and api-test-generator are
      # both public — workspace-cli clones them anonymously, no token needed
      # for that. api-test-generator does NOT get a persisted rewrite here
      # even though the agent may later push there: the guidance has it set
      # GH_TOKEN_GENERATOR explicitly on the push URL at push time (see
      # "Fixing a test-generation / coverage bug"), so a global rewrite would
      # only add exposure (present in gitconfig during `workspace create`,
      # before the later scrub step) with no cloning benefit.
      - name: Configure git credentials for cloning
        # Only needed to clone camunda-hub for the agent's workspace (has_reports
        # true). Without this guard, the exit 1 below on an empty HUB_TOKEN
        # would hard-fail a no-reports night before it ever reaches the
        # inconclusive-result write — same reasoning as the two steps above.
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        env:
          HUB_TOKEN: ${{ steps.hub-token.outputs.token }}
        run: |
          set -euo pipefail
          # hub-token isn't continue-on-error (unlike the two qa-processes
          # tokens) — camunda-hub is the one repo this workflow cannot function
          # without. Fail here with a clear reason rather than silently
          # configuring a rewrite with an empty token and letting `workspace
          # create` fail later with a much less actionable git/auth error.
          if [ -z "$HUB_TOKEN" ]; then
            echo "::error::No camunda-hub clone token — hub-clone-token action returned empty (check Vault OIDC + preview-envs role, and that the App is installed on camunda/camunda-hub with Contents: Read)."
            exit 1
          fi
          git config --global url."https://x-access-token:${HUB_TOKEN}@github.com/camunda/camunda-hub".insteadOf "https://github.com/camunda/camunda-hub"

      # --- Create the 3-repo workspace ----------------------------------------
      - name: Stage workspace manifest + guidance
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.workspace-templates"
          src="resources/workspace-templates/camunda-hub-nightlies"
          cp "$src/camunda-hub-nightlies.guidance.yaml" "$HOME/.workspace-templates/camunda-hub-nightlies.yaml"
          cp "$src/camunda-hub-nightlies.guidance.md"   "$HOME/.workspace-templates/camunda-hub-nightlies.guidance.md"

      - name: Compute workspace name
        id: ws
        run: echo "name=hub-triage-${{ steps.nightly.outputs.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Create workspace
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        run: |
          set -euo pipefail
          # --manifest takes a bare NAME (workspace-cli resolves it against
          # ~/.workspace-templates/<name>.yaml itself, trying .yaml then .yml)
          # — NOT a path and NOT an extension, despite the staged file above
          # literally being that path. Passing the full path (as this step
          # used to) makes workspace-cli try to resolve it AGAIN relative to
          # its own templates dir, producing a doubled, nonexistent path.
          # Matches the exact invocation the c8-orchestration-cluster-e2e-
          # nightly-fix.yml reference this agent is modeled on already uses
          # (`--manifest camunda-orchestration-cluster-nightly`, no path).
          workspace create "${{ steps.ws.outputs.name }}" \
            --manifest camunda-hub-nightlies

      # Cloning is done — scrub the token-bearing url.*.insteadOf rewrites from
      # global gitconfig BEFORE the agent (running with
      # --dangerously-skip-permissions, and fed untrusted report content) can
      # read them. If it needs to push a fix PR, the guidance instructs it to
      # set the credential explicitly at push time from $GH_TOKEN_GENERATOR —
      # it never needs the persisted global rewrite for that.
      - name: Scrub git credentials before running the agent
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        run: |
          # --unset-all needs the exact key, and the key itself embeds the
          # token value — enumerate every url.*.insteadof key and unset any
          # whose key contains the token marker, rather than reconstructing
          # the token value here.
          # GitHub Actions runs bash steps with -e/pipefail by default even
          # without an explicit `set` line — --get-regexp exits 1 when there
          # are no matches (e.g. a future change removes the earlier rewrite
          # entirely), which would otherwise abort this step even though
          # "nothing to scrub" is a perfectly valid, unremarkable state.
          git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null | while read -r key _; do
            case "$key" in
              *x-access-token*) git config --global --unset-all "$key" ;;
            esac
          done || true
          grep -qi 'x-access-token' "$HOME/.gitconfig" 2>/dev/null && echo "::warning::token-bearing gitconfig entry survived scrub" || true

      # --- Discover open fix PRs, by actual diff content ------------------------
      # Mirrors the c8-orchestration-cluster-e2e-nightly-triage.yml reference's
      # "skip dispatch when an open failing-test-fix PR already exists" dedup —
      # without this, the same persisting bug could get a duplicate fix PR
      # opened every night until the first one merges. The reference matches by
      # FILE PATH (their tests map 1:1 to committed spec files); that doesn't
      # translate here — our fix PRs touch shared config files
      # (positive-suppress.json, ontology mappings, generator source) where the
      # operationId lives IN the content, not the path. So this fetches each
      # open nightly-api-fix PR's actual diff (ground truth, not a self-reported
      # tag) and hands the raw list to the agent, which checks whether its
      # operationId appears anywhere in an open PR's diff before attempting a
      # new fix. Read-only against this repo — github.token suffices, no
      # dependency on the (possibly-unavailable) qa-processes token.
      - name: Discover open fix PRs (for dedup by diff content)
        id: covered
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/open-fix-prs.json"
          acc="$(mktemp)"
          diff_file="$(mktemp)"
          echo '[]' > "$acc"
          # Capture stderr to a file, NOT via 2>&1 into $nums — 2>&1 would mix
          # any stderr warning gh/jq emit into the PR-number list even on the
          # success path, and a non-numeric line later breaks ($n|tonumber)
          # and aborts this step under pipefail.
          list_err="$(mktemp)"
          if ! nums=$(gh pr list --repo camunda/api-test-generator \
                   --search "label:nightly-api-fix is:open" \
                   --limit 50 --json number --jq '.[].number' 2>"$list_err"); then
            echo "::warning::Could not list open nightly-api-fix PRs ($(cat "$list_err")) — dedup coverage for this run will be empty, which could let a duplicate PR get opened for an already-in-flight fix."
            nums=""
          fi
          rm -f "$list_err"
          if [ -n "$nums" ]; then
            while IFS= read -r n; do
              [ -z "$n" ] && continue
              # Cap each PR's diff: the guardrails require fix PRs to be
              # minimal/mechanical, so a large diff here is itself a signal
              # something's off — this just bounds the worst-case file size.
              # Diff content is passed via --rawfile and the running
              # accumulator via a temp FILE (never a shell variable) — a diff
              # containing an embedded newline round-tripped through
              # `var=$(...)` was observed to produce invalid JSON (a raw
              # unescaped control character survives into the string) on this
              # jq/shell combination; file-to-file avoids that class of bug
              # entirely rather than chasing its root cause.
              if ! gh pr diff "$n" --repo camunda/api-test-generator 2>/dev/null | head -c 20000 > "$diff_file"; then
                echo "::warning::Could not fetch diff for open fix PR #${n} — its dedup coverage for this run will be incomplete (empty diff), which could let a duplicate PR get opened for an already-in-flight fix."
                : > "$diff_file"
              fi
              # --slurpfile reads the accumulator straight from the file
              # (binding $acc to a 1-element array containing it, hence
              # $acc[0] below) rather than injecting its content as a
              # command-line argument — with up to 50 PRs x a 20KB diff cap
              # each, --argjson acc "$(cat "$acc")" could approach/exceed
              # ARG_MAX after JSON-escaping overhead and fail this step,
              # silently defeating the dedup guardrail.
              jq -n --slurpfile acc "$acc" --arg n "$n" \
                --arg url "https://github.com/camunda/api-test-generator/pull/${n}" \
                --rawfile diff "$diff_file" \
                '$acc[0] + [{number: ($n|tonumber), url: $url, diff: $diff}]' > "${acc}.new"
              mv "${acc}.new" "$acc"
            done <<< "$nums"
          fi
          cp "$acc" "$out"
          rm -f "$acc" "$diff_file"
          count=$(jq 'length' "$out")
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Open nightly-api-fix PRs found: ${count}"

      # --- Run the Claude triage agent ----------------------------------------
      - name: Run Claude triage agent in workspace
        id: agent
        if: ${{ steps.reports.outputs.has_reports == 'true' }}
        env:
          OPEN_FIX_PRS_FILE: ${{ github.workspace }}/open-fix-prs.json
          # #482 — always exists (the "Ensure curl-verification.json exists"
          # step above guarantees it), but may be "{}" if there were no
          # negative-suite failures, the Hub never came up, or the script
          # itself errored. Treat a missing key the same as an empty file:
          # verification unavailable for that test, fall back to
          # single-observation judgment (see the guidance's own section).
          CURL_VERIFICATION_FILE: ${{ github.workspace }}/curl-verification.json
          ANTHROPIC_API_KEY: ${{ steps.vault.outputs.ANTHROPIC_API_KEY }}
          # Two separately-scoped tokens — see "Configure git credentials" above
          # and the guidance's Role section for which one is valid where.
          # Empty if the App couldn't be reached → the agent falls back to
          # report-only for that repo at runtime.
          GH_TOKEN_HUB: ${{ steps.qa-token-hub.outputs.token }}
          GH_TOKEN_GENERATOR: ${{ steps.qa-token-generator.outputs.token }}
          NIGHTLY_RUN_URL: ${{ steps.nightly.outputs.run_url }}
          REPORTS_DIR: ${{ env.REPORTS_DIR }}
          WORKSPACE_NAME: ${{ steps.ws.outputs.name }}
        run: |
          set -euo pipefail
          ws_dir="$HOME/workspaces/${WORKSPACE_NAME}"
          rm -f /tmp/hub-triage.json

          prompt=$(cat <<EOF
          You are the camunda-hub nightly API TRIAGE agent, working in the workspace at ${ws_dir}.
          Read AGENTS.md and the workspace guidance ("camunda-hub Nightly API Triage — Workspace
          Guidance") FIRST — it defines the two suites, the unmapped-operations coverage check, the
          debug procedure, the categories, the product-bug commit-dedup rule, the known-issue
          reconciliation, the test-generation/coverage fix-PR procedure, and the exact output schema.
          Follow it precisely.

          Your write access is asymmetric — memorize this: camunda-hub gets issues ONLY, never code,
          never a PR, never a push (use \$GH_TOKEN_HUB for that, nothing else). api-test-generator may
          get a PR, but ONLY for a confirmed test-generation bug or an unmapped-operation with an
          obvious, minimal, safe fix — never a direct push to main (use \$GH_TOKEN_GENERATOR for that,
          and only after you're confident per the guidance's guardrails). camunda-docs is always
          read-only. When in doubt, report-only — that is always the safe choice.

          Inputs:
          - The downloaded nightly reports are at: ${REPORTS_DIR}
            (pw-positive.{json,junit.xml}, pw-secured.*, pw-rbac.*, pw-*/index.html HTML reports, and
            coverage.json — check its summary.unmappedOperations EVERY run, independent of suite
            pass/fail, per the guidance). NOTE: there is no Playwright trace (trace capture is off in
            both suite configs) — the request/response evidence for a negative-suite failure is its
            request.json/response.json attachment; a positive-suite failure has no such attachment,
            recover what you can from the HTML report's own error message instead.
          - OpenAPI spec: ${ws_dir}/camunda-hub/restapi/public-api/src/main/resources/openapi/v2/*.yaml
          - Suite configs (known issues): ${ws_dir}/api-test-generator/configs/camunda-hub/positive-suppress.json
            and request-validation.json
          - Nightly run URL: ${NIGHTLY_RUN_URL}
          - Open fix PRs already in flight (JSON array of {number, url, diff}, may be []):
            ${OPEN_FIX_PRS_FILE} — before fixing ANY operationId, check whether it appears
            anywhere in one of these diffs (a substring match, e.g. as a JSON key in
            positive-suppress.json or a comment); if so, that operation is already being
            fixed elsewhere.
          - Live curl-replay verification results (#482), negative-suite failures only, may be "{}"
            (no negative-suite failures, or verification itself was unavailable that night):
            ${CURL_VERIFICATION_FILE} — keyed by "<operationId>::<scenarioKind>::<test title>", each
            entry \`{ confirmed: true|false|null, curlStatus, expectedStatus, curlBody, error }\`.
            confirmed:true means the exact same request STILL gets the wrong response right now
            against a fresh Hub; confirmed:false means it no longer reproduces (treat as unconfirmed/
            flaky, per the guidance's "when in doubt, report-only" rule — do not file); confirmed:null
            means it could not be checked (see its error field — e.g. a body-shape-only failure this
            tool doesn't re-verify, or no deny token available) — fall back to your own single-
            observation judgment as before. See the guidance's "Filing a product-bug issue" section
            for exactly where this plugs in.
          - NOTE: the generated *.spec.ts files are gitignored and NOT present here — recover what
            each test asserted from the report's request/response attachment + assertion error, not
            from source.

          Do this:
          1. Parse both suites' JSON/JUnit and enumerate every failing test (positive + negative).
          2. Check coverage.json's summary.unmappedOperations regardless of suite results — these
             never show up as failing tests, so they're easy to miss on an all-green night.
          3. For each test failure: read its request/response attachment (negative suite) or the HTML
             report's own error message (positive suite — no attachment exists there) to see the
             actual request+response+assertion, then resolve the operation in the OpenAPI v2 spec.
          4. Classify each as product / infrastructure / flakiness with evidence. A "product" bug
             REQUIRES the response to CONTRADICT the spec (mind the 400→404→403 precedence quirk
             described in the guidance before calling a status mismatch a product bug); if the
             response and spec AGREE but the test failed, that is a test-generation bug (subcategory
             "test-generation") — never a camunda-hub issue.
          5. Reconcile against the knownIssue entries before calling anything a NEW bug.
          6. For each PRODUCT bug (response contradicts spec) that is NOT already-known: search recent
             camunda-hub main commits for a related change. If a related commit explains it → action
             "skip" (record the commit). If not, and this is a NEGATIVE-suite failure, look up its
             entry in ${CURL_VERIFICATION_FILE} (#482) BEFORE filing — key
             "<operationId>::<scenarioKind>::<test title>":
               - confirmed:true → proceed to file, and include the curl exchange (status + body) from
                 curlStatus/curlBody as extra evidence in the issue body.
               - confirmed:false → do NOT file. It no longer reproduces against a fresh Hub right now —
                 treat as unconfirmed/flaky (category unchanged, action "report-only", note in your
                 reasoning that a live re-check no longer reproduced it).
               - confirmed:null, or no entry at all (positive-suite failure, or verification was
                 unavailable that night) → fall back to filing on your own single-observation judgment
                 as before, and say so explicitly in the issue/summary (so it's visible that live
                 re-verification was attempted but inconclusive, not silently skipped).
             Once past that check: compute the fingerprint, dedup by the
             \`nightly-api-triage fp=<fp>\` marker (then by symptom), and either link the existing issue
             or file a new one with \`gh issue create --repo camunda/camunda-hub\` using GH_TOKEN_HUB
             (labels kind/bug + nightly-detected, already pre-created; fingerprint marker in the body).
             If GH_TOKEN_HUB is empty or filing fails, set action "report-only" with file_error.
          7. For EVERY product bug you just filed OR found already-known (known_issue: true) — not only
             newly-filed ones — also suppress the affected test in api-test-generator: per the
             guidance's "Suppressing a confirmed product bug" section, ONLY the exact operationId+suite
             this failure implicates, never other operations. Check ${OPEN_FIX_PRS_FILE}'s diffs first;
             if already covered by an open PR, set suppress_pr_url to that PR's url instead of opening a
             duplicate. Record the result as suppress_pr_url (or leave null + suppress_error, a separate
             field from file_error, if it couldn't be done) — independent of the issue-filing action
             above, never fails the run.
          8. For each test-generation bug or unmapped operation: search ${OPEN_FIX_PRS_FILE}'s diffs
             for the operationId FIRST. If it appears in any listed PR's diff: do NOT attempt a fix —
             set action "skip" and fix_pr_url to that PR's url. Otherwise, per the guidance's
             guardrails, either apply a minimal fix and open an api-test-generator PR using
             GH_TOKEN_GENERATOR (label nightly-api-fix, already pre-created), or — if you're not fully
             confident — action "report-only". Never push directly to main.
          9. Write the full triage result to /tmp/hub-triage.json in the exact schema from the guidance.
          EOF
          )

          set +e
          claude -p "$prompt" --dangerously-skip-permissions
          agent_rc=$?
          set -e
          echo "claude exit code: ${agent_rc}"

          if [ ! -s /tmp/hub-triage.json ]; then
            echo "::warning::Agent did not write /tmp/hub-triage.json — writing a crash sentinel."
            printf '{"run_url":"%s","suites":{},"failures":[],"counts":{},"agent_error":true}\n' \
              "${NIGHTLY_RUN_URL}" > /tmp/hub-triage.json
          fi
          cp /tmp/hub-triage.json "${GITHUB_WORKSPACE}/hub-triage.json"

      # Any fix/suppress/unskip PR opened against api-test-generator already
      # gets a real live-Hub check automatically: hub-pr-live-check.yml fires
      # on every same-repo `pull_request` targeting main whose diff doesn't
      # touch .github/** (exactly what these bot-opened PRs look like), and
      # runs the same _hub-suite-run.yml reusable hub-ondemand-test.yml wraps
      # — as a native GitHub Actions check, not a comment. A prior version of
      # this workflow manually dispatched hub-ondemand-test.yml and commented
      # the run link for the same purpose; that became redundant once
      # hub-pr-live-check.yml shipped (#513) and has been removed.

      # No reports downloaded → write an inconclusive result so Slack announces it
      # (never a green digest). Mirrors the c8 "no false all-clear" rule.
      - name: Write inconclusive result (no reports)
        if: ${{ steps.reports.outputs.has_reports != 'true' }}
        env:
          NIGHTLY_RUN_URL: ${{ steps.nightly.outputs.run_url }}
        run: |
          set -euo pipefail
          printf '{"run_url":"%s","suites":{},"failures":[],"counts":{},"inconclusive":true}\n' \
            "${NIGHTLY_RUN_URL}" > "${GITHUB_WORKSPACE}/hub-triage.json"

      # --- Post the triaged digest to Slack -----------------------------------
      - name: Post triage summary to Slack
        id: slack-summary
        if: ${{ always() && steps.slack.outputs.SLACK_BOT_TOKEN != '' }}
        # Notification infra must not fail the run — the triage JSON is already
        # produced and uploaded regardless of whether Slack is reachable.
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ steps.slack.outputs.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NIGHTLY_RUN_URL: ${{ steps.nightly.outputs.run_url }}
        run: |
          set -euo pipefail
          f="${GITHUB_WORKSPACE}/hub-triage.json"
          summary=$(bash scripts/triage/hub-triage-format-slack.sh "$f" summary || true)
          text=":mag: *camunda-hub API Triage — $(date -u +%Y-%m-%d)*"$'\n'"${summary}"
          text="${text}"$'\n\n'"<${NIGHTLY_RUN_URL}|📊 nightly run> · <${RUN_URL}|🔎 triage run>"

          payload=$(jq -nc --arg channel "$SLACK_CHANNEL" --arg text "$text" \
            '{channel: $channel, text: $text, mrkdwn: true}')
          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")
          echo "$response" | jq '.'
          ts=$(echo "$response" | jq -r '.ts // ""')
          channel=$(echo "$response" | jq -r '.channel // ""')
          echo "ts=${ts}"           >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          [ "$(echo "$response" | jq -r '.ok')" = "true" ] || echo "::warning::Slack summary post failed"

      - name: Post per-failure detail to Slack thread
        if: ${{ always() && steps.slack.outputs.SLACK_BOT_TOKEN != '' && steps.slack-summary.outputs.ts != '' }}
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ steps.slack.outputs.SLACK_BOT_TOKEN }}
          SLACK_TS: ${{ steps.slack-summary.outputs.ts }}
          SLACK_CHANNEL_ID: ${{ steps.slack-summary.outputs.channel }}
        run: |
          set -euo pipefail
          f="${GITHUB_WORKSPACE}/hub-triage.json"
          detail=$(bash scripts/triage/hub-triage-format-slack.sh "$f" thread || true)
          # No failures → no thread reply.
          [ -z "$detail" ] && { echo "No failures — skipping thread reply."; exit 0; }
          payload=$(jq -nc \
            --arg channel   "$SLACK_CHANNEL_ID" \
            --arg thread_ts "$SLACK_TS" \
            --arg text      "$detail" \
            '{channel: $channel, thread_ts: $thread_ts, text: $text, mrkdwn: true}')
          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload")
          [ "$(echo "$response" | jq -r '.ok')" = "true" ] || echo "::warning::Slack thread reply failed"

      # --- Persist the triage result ------------------------------------------
      - name: Upload triage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-triage-${{ steps.nightly.outputs.run_id }}
          path: hub-triage.json
          retention-days: 30

      - name: Write triage to run summary
        if: always()
        run: |
          {
            echo "## camunda-hub API Triage"
            echo ""
            echo '```json'
            cat "${GITHUB_WORKSPACE}/hub-triage.json" 2>/dev/null || echo "{}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
