# description: Nightly API test run for camunda-oca — positive (lifecycle) +
#              request-validation (negative) suites against a live, unsecured
#              camunda-oca (Camunda 8 REST API) cluster. Runs as a matrix, one
#              leg per live camunda/camunda branch (main, stable/8.10), each
#              fetching the OpenAPI spec straight from that branch's current
#              tip. Each leg starts docker/docker-compose.yml against the
#              matching Docker image tag, regenerates + runs both suites, and
#              posts its own grouped failure breakdown to the run summary.
#
#              GATING IS STRICT, by design: any test failure fails a leg, the
#              same as nightly-camunda-hub.yml. Both legs are expected to move
#              over time as their branches do — that's the point of them.
#
#              Previously also ran a `pinned-8.9` leg (a frozen, hash-verified
#              spec pin used to track #540's steady-state request-validation
#              failure count) and a `stable-8.9` leg (live-tracking
#              stable/8.9). Both were removed: `stable/8.9` predates an
#              upstream x-semantic-provider annotation the generator depends
#              on (camunda/api-test-generator#559), and `pinned-8.9` read the
#              same shared spec pin that now tracks main instead of a frozen
#              8.9-era spec, so its steady-count premise no longer held.
# type: CI
# owner: @camunda/test-automation-team
---
name: Nightly — camunda-oca API tests

on:
  schedule:
    # 03:00 UTC nightly — offset from nightly-camunda-hub.yml's 02:00 slot.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Don't pile up overlapping nightly runs — covers the whole matrix as one unit.
concurrency:
  group: nightly-camunda-oca
  cancel-in-progress: true

jobs:
  nightly-oca:
    name: Generate → run → report (${{ matrix.name }})
    uses: ./.github/workflows/_oca-suite-run.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            camunda_image_tag: SNAPSHOT
            spec_ref: main
          - name: stable-8.10
            camunda_image_tag: 8.10-SNAPSHOT
            spec_ref: stable/8.10
    with:
      camunda_image_tag: ${{ matrix.camunda_image_tag }}
      spec_ref: ${{ matrix.spec_ref }}
      artifact_name: oca-suite-reports-${{ matrix.name }}
      summary_heading: '## Nightly — camunda-oca API tests (${{ matrix.name }})'
