# Reusable camunda-oca suite run (workflow_call). The shared body behind every
# "generate the OCA suite + run it against a live camunda-oca cluster" entry
# point — the nightly (nightly-camunda-oca.yml) and the on-demand test
# (oca-ondemand-test.yml) both call it, so the orchestration lives in ONE
# place (#539).
#
# Much smaller than _hub-suite-run.yml: OCA needs no Keycloak, no Vault, no
# OIDC and no Slack app — the spec comes straight from the public
# camunda/camunda repo via the existing pinned-spec flow (same as ci.yml's
# `regression` job), and the cluster is a single container with its own
# compose healthcheck.
name: _oca-suite-run

on:
  workflow_call:
    inputs:
      summary_heading:
        description: Markdown heading block for the run summary.
        type: string
        required: true
      rv_profiles:
        description: Space-separated request-validation profiles to run (RV_PROFILES).
        type: string
        default: unsecured
      camunda_image_tag:
        description: camunda/camunda image tag to run (sets CAMUNDA_VERSION).
        type: string
        default: 8.9-SNAPSHOT
      spec_ref:
        description: >-
          camunda/camunda ref (branch/tag/SHA) to fetch the OpenAPI spec
          from. Empty uses the pinned spec (configs/camunda-oca/spec-pin.json).
        type: string
        default: ''
      artifact_name:
        description: >-
          Name for the uploaded suite-reports artifact. Override this when a
          caller runs multiple legs concurrently (e.g. a matrix) — concurrent
          jobs can't upload artifacts under the same name.
        type: string
        default: oca-suite-reports

permissions:
  contents: read

env:
  CONFIG: camunda-oca
  CORE_URL: http://localhost:8080

jobs:
  run:
    name: Generate + run OCA suites (${{ inputs.rv_profiles }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout api-test-generator
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      # camunda-oca's spec comes straight from the public camunda/camunda repo
      # (no clone token needed) — same pinned-spec flow as ci.yml's
      # `regression` job. run-oca.sh never fetches the spec itself and the
      # bundled spec isn't checked into git, so this has to happen first.
      #
      # `inputs.spec_ref` lets an on-demand run fetch the spec from an
      # arbitrary branch/tag/SHA instead of the pin — e.g. to test a
      # camunda_image_tag against the spec that actually shipped with it
      # (`stable/8.10`) rather than the nightly's fixed, hash-verified pin.
      # camunda-schema-bundler's --ref already accepts any git ref, so no
      # change is needed downstream; only the nightly's hash-drift check
      # (tests/regression/spec-pin.setup.ts) requires the pin's exact SHA,
      # and that check isn't part of this job.
      - name: Resolve spec ref
        id: pin
        env:
          OVERRIDE_SPEC_REF: ${{ inputs.spec_ref }}
        run: |
          # A workflow_dispatch text input can't be trimmed at the YAML
          # level, so a stray space (or newline) here would otherwise take
          # the override branch below and fail confusingly downstream —
          # fetch-spec.ts trims SPEC_REF to empty and hard-fails — instead of
          # falling back to the pin as documented ("empty uses the pinned
          # spec"). Trim first so whitespace-only counts as empty.
          trimmed_ref="${OVERRIDE_SPEC_REF#"${OVERRIDE_SPEC_REF%%[![:space:]]*}"}"
          trimmed_ref="${trimmed_ref%"${trimmed_ref##*[![:space:]]}"}"
          if [ -n "$trimmed_ref" ]; then
            # spec_ref is a workflow_dispatch user input, so a newline (or
            # CR, e.g. from a pasted CRLF value) in it would let
            # `echo "spec_ref=${spec_ref}" >> "$GITHUB_OUTPUT"` define
            # arbitrary extra step outputs, or otherwise confuse output
            # parsing/log rendering. A git ref can't legitimately contain
            # either, so reject it instead of writing it through.
            if [[ "$trimmed_ref" == *[$'\n\r']* ]]; then
              echo "::error::spec_ref must be a single-line git ref (branch/tag/SHA); got a value containing a newline or carriage return"
              exit 1
            fi
            spec_ref="$trimmed_ref"
            echo "Using override camunda-oca specRef: ${spec_ref}"
          else
            spec_ref=$(node -e "console.log(JSON.parse(require('fs').readFileSync('configs/camunda-oca/spec-pin.json','utf8')).specRef)")
            echo "Using pinned camunda-oca specRef: ${spec_ref}"
          fi
          printf 'spec_ref=%s\n' "$spec_ref" >> "$GITHUB_OUTPUT"

      - name: Fetch OpenAPI spec
        env:
          SPEC_REF: ${{ steps.pin.outputs.spec_ref }}
        run: npm run fetch-spec:ref

      # Camunda 8.10 made the RDBMS datasource bootstrap read exclusively from the
      # Unified Configuration namespace (camunda.data.secondary-storage.rdbms.*),
      # with no fallback to the legacy CAMUNDA_DATABASE_* vars the base compose file
      # sets for 8.9 — see docker/docker-compose.rdbms-unified-config.yml for the
      # full explanation. Layer that overlay in for anything that isn't 8.9.x.
      - name: Select compose files for camunda_image_tag
        id: compose
        env:
          CAMUNDA_VERSION: ${{ inputs.camunda_image_tag }}
        run: |
          files='-f docker/docker-compose.yml'
          case "$CAMUNDA_VERSION" in
            8.9*) ;;
            *) files="$files -f docker/docker-compose.rdbms-unified-config.yml" ;;
          esac
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "Compose files for camunda_image_tag=${CAMUNDA_VERSION}: ${files}"

      # docker/docker-compose.yml already declares a healthcheck against
      # /actuator/health/status — `--wait` blocks on it instead of a custom
      # polling script (unlike Hub, which has no compose healthcheck of its
      # own and needs the wait-for-hub action).
      - name: Start camunda-oca
        env:
          CAMUNDA_VERSION: ${{ inputs.camunda_image_tag }}
        run: docker compose ${{ steps.compose.outputs.files }} up -d --wait

      # Generate + run the positive (lifecycle) suite and every requested
      # request-validation profile. Gating is strict: run-oca.sh fails on any
      # Playwright test failure (positive or request-validation) — matching
      # the Hub nightly's "any failure fails the run".
      - name: Generate + run positive + request-validation suites
        id: suites
        env:
          RV_PROFILES: ${{ inputs.rv_profiles }}
          STEPS: 'generate run'
        run: ./scripts/e2e/run-oca.sh

      # docker compose up -d runs detached, so the container's own stdout/
      # stderr (the actual Spring Boot / Zeebe startup exception, if that's
      # why it failed) never appears anywhere else in this log — without this,
      # a startup crash shows only as "container camunda-engine exited (255)"
      # with no way to tell why.
      - name: Dump camunda-engine logs on failure
        if: failure()
        run: docker compose ${{ steps.compose.outputs.files }} logs --no-color --tail 150 camunda || true

      - name: Stop camunda-oca
        if: always()
        run: docker compose ${{ steps.compose.outputs.files }} down -v || true

      # Grouped failure breakdown per profile (actual HTTP status / scenario
      # kind / operationId), same analyser the generated suite's own `npm run
      # summarize` uses — see request-validation/templates/scripts/summarize-failures.mjs.
      - name: Write failure breakdown to run summary
        if: always()
        env:
          RV_PROFILES: ${{ inputs.rv_profiles }}
          HEADING: ${{ inputs.summary_heading }}
          SPEC_REF_USED: ${{ steps.pin.outputs.spec_ref }}
        run: |
          out="test-results/e2e-${CONFIG}"
          {
            printf '%s\n' "$HEADING"
            echo "spec ref used: \`${SPEC_REF_USED}\`"
            echo ""
            echo "### Positive (lifecycle)"
            if [ -f "$out/pw-positive.json" ]; then
              echo '```text'
              node request-validation/templates/scripts/summarize-failures.mjs "$out/pw-positive.json"
              echo '```'
            else
              echo "- no report — the suite may not have run (SKIP_POSITIVE?) or crashed before writing results"
            fi
            echo ""
            echo "### Request-validation"
            for p in $RV_PROFILES; do
              echo "#### profile: $p"
              if [ -f "$out/pw-$p.json" ]; then
                echo '```text'
                node request-validation/templates/scripts/summarize-failures.mjs "$out/pw-$p.json"
                echo '```'
              else
                echo "- no report for profile '$p' — the suite may not have generated or crashed before writing results"
              fi
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OCA suite reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: test-results/e2e-camunda-oca/
          retention-days: 14
