# description: The classification agent job of hub-pr-check.yml (its `classify` job), called from there. It lives in
#              its own workflow so the Vault wrapping token from the `classify-secrets` job arrives as a secret,
#              which GitHub masks in this job's log; a plain job output would be printed in clear text
#              (camunda/infra-global-github-actions#925). The `github` context is the caller's.
# type: CI
# owner: @camunda/test-automation-team
---
name: _hub-pr-check-classify-agent

on:
  workflow_call:
    inputs:
      source-sha:
        description: The validated camunda-hub PR source SHA (validate job).
        type: string
        required: true
      pr-number:
        description: The validated camunda-hub PR number (validate job), may be empty.
        type: string
        default: ''
      base-ref:
        description: The validated base branch of the camunda-hub PR (validate job), may be empty.
        type: string
        default: ''
      unmapped-operations:
        description: The run job's unmapped_operations, may be empty.
        type: string
        default: ''
    secrets:
      VAULT_ADDR:
        required: true
      WRAP_TOKEN:
        description: The wrap-token output of the caller's classify-secrets job. Empty when wrapping failed (best effort).
        required: false
    outputs:
      category:
        value: ${{ jobs.classify.outputs.category }}
      confidence:
        value: ${{ jobs.classify.outputs.confidence }}
      summary:
        value: ${{ jobs.classify.outputs.summary }}
      fingerprint:
        value: ${{ jobs.classify.outputs.fingerprint }}
      observed:
        value: ${{ jobs.classify.outputs.observed }}
      caused_by_pr:
        value: ${{ jobs.classify.outputs.caused_by_pr }}
      affected_operation_ids:
        value: ${{ jobs.classify.outputs.affected_operation_ids }}

jobs:
  classify:
    name: Classification agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      category: ${{ steps.parse.outputs.category }}
      confidence: ${{ steps.parse.outputs.confidence }}
      summary: ${{ steps.parse.outputs.summary }}
      fingerprint: ${{ steps.evidence.outputs.fingerprint }}
      # "true" only when the run left evidence of WHAT failed (a failing spec or unmapped operations).
      observed: ${{ steps.evidence.outputs.observed }}
      caused_by_pr: ${{ steps.parse.outputs.caused_by_pr }}
      affected_operation_ids: ${{ steps.parse.outputs.affected_operation_ids }}
    steps:
      # First step: the secrets come from the classify-secrets job, so this job needs no Vault login.
      # Best effort like the rest of this job: an unwrap failure leaves the outputs empty and the
      # agent step is skipped.
      - name: Unwrap secrets from Vault
        id: vault
        continue-on-error: true
        uses: camunda/infra-global-github-actions/vault-wrapped-secrets/unwrap@20cb58c9ce170db539d649284bae2c35440ababd # vault-wrapped-secrets-1.0.2
        with:
          vault-url: ${{ secrets.VAULT_ADDR }}
          wrap-token: ${{ secrets.WRAP_TOKEN }}

      - name: Checkout api-test-generator
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download hub-suite Playwright reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hub-suite-reports
          path: test-results/e2e-camunda-hub

      # Without this, a run that produced no evidence looks the same to the
      # classifier as one whose tests simply passed, and it reports "could not
      # confirm" — which reads as a problem with the camunda-hub PR rather than
      # with the harness. Say which it is. Advisory on purpose: the classifier
      # still runs and still posts, it just no longer implies the PR is at fault.
      #
      # "Artifact present" is NOT the same as "reports present": run-hub.sh
      # opens pw-<profile>.stderr.log by shell redirection BEFORE
      # `npx playwright test` starts, so a crash before any reporter writes
      # still leaves a non-empty directory that uploads and downloads happily.
      # Only a Playwright JSON or JUnit report counts as evidence.
      - name: Note when no report evidence was produced
        env:
          DOWNLOAD_OUTCOME: ${{ steps.reports.outcome }}
        run: |
          set -euo pipefail
          dir="test-results/e2e-camunda-hub"
          if [ "${DOWNLOAD_OUTCOME}" != "success" ]; then
            echo "::warning::No hub-suite-reports artifact — no Playwright/JUnit reports are available for classification (the suite may have produced none, or artifact upload/download may have failed). Check the suite job and artifact step before attributing this to the camunda-hub PR."
          elif [ -z "$(find "$dir" -type f \( -name 'pw-*.json' -o -name 'pw-*.junit.xml' \) -print -quit 2>/dev/null)" ]; then
            echo "::warning::hub-suite-reports artifact contains no Playwright JSON or JUnit report (only logs, if anything), so this run cannot be classified as pass or fail. Playwright died before writing a report — check the pw-*.stderr.log in the artifact and the suite job, not the camunda-hub PR."
          else
            echo "Report evidence present."
          fi

      # Node 22 runs the evidence script directly (type stripping, no npm install) and is also
      # what the Claude Code CLI below needs.
      - name: Setup Node.js 22
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Ported from camunda-hub's AlwaysGreen triage (classify.py): the agent is handed the
      # reports already parsed into per-spec attempt histories instead of re-parsing raw JSON, and
      # the failing set is fingerprinted so `report` can edit one Slack reply in place for a
      # repeated failure on a PR instead of paging again on every push. There is no retry-based
      # verdict: Playwright exits 0 when a retry passes and this job only runs after a failed run,
      # so such a verdict could never fire for a real flaky run and could only hide another failure.
      - name: Extract deterministic evidence from the reports
        id: evidence
        continue-on-error: true
        env:
          UNMAPPED: ${{ inputs.unmapped-operations }}
          PR_NUMBER: ${{ inputs.pr-number }}
          SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          node scripts/triage/hub-pr-evidence.ts \
            --reports test-results/e2e-camunda-hub \
            --unmapped "$UNMAPPED" \
            --pr "$PR_NUMBER" --sha "$SHA" \
            --out "${GITHUB_WORKSPACE}/hub-pr-evidence.json"

      - name: Clone camunda-hub @ PR sha (sibling ../camunda-hub)
        if: fromJSON(steps.vault.outputs.secrets || '{}').HUB_CLONE_TOKEN != ''
        continue-on-error: true
        uses: ./.github/actions/clone-hub-sibling
        with:
          token: ${{ fromJSON(steps.vault.outputs.secrets || '{}').HUB_CLONE_TOKEN }}
          ref: ${{ inputs.source-sha }}

      # One clone, diffed against the PR's base, instead of cloning both refs
      # separately — the OpenAPI dir only, this is the one signal that
      # actually distinguishes "generator doesn't handle this yet" (operation
      # is new/changed in this PR) from "hub regressed" (operation unchanged).
      - name: Diff the OpenAPI spec against the PR's base
        id: specdiff
        if: fromJSON(steps.vault.outputs.secrets || '{}').HUB_CLONE_TOKEN != ''
        continue-on-error: true
        env:
          SHA: ${{ inputs.source-sha }}
          BASE_REF: ${{ inputs.base-ref }}
          HUB_TOKEN: ${{ fromJSON(steps.vault.outputs.secrets || '{}').HUB_CLONE_TOKEN }}
        run: |
          set -euo pipefail
          cd ../camunda-hub
          # camunda-hub is private and clone-hub-sibling leaves `origin` on the
          # plain https URL, applying the App token only through a per-command
          # `-c url.<authed>.insteadOf` rewrite. Any fetch here needs the same
          # rewrite or it gets "Repository not found" — which, since this step
          # is continue-on-error, would silently leave the classifier with no
          # baseline at all.
          git_authed() {
            git -c "url.https://x-access-token:${HUB_TOKEN}@github.com/.insteadOf=https://github.com/" "$@"
          }
          # Explicit refspec: a bare `git fetch origin <branch>` does not
          # reliably create the remote-tracking ref across git versions, and
          # the diff below needs origin/<base>.
          fetch_base() {
            git_authed fetch -q --depth 1 origin "$1:refs/remotes/origin/$1"
          }
          # The PR's own base, not main. camunda-hub stacks much of its work, so
          # for a PR based on a feature branch, main is the wrong baseline and
          # the diff then describes the whole stack rather than this PR.
          #
          # Fall back to main when the dispatch carried no usable ref, or when
          # the branch no longer resolves — a stacked PR's base can be merged
          # and deleted while this run sits queued.
          base=""
          if [ -n "${BASE_REF}" ] && fetch_base "${BASE_REF}"; then
            base="${BASE_REF}"
          else
            if [ -n "${BASE_REF}" ]; then
              echo "::warning::base_ref '${BASE_REF}' could not be fetched — falling back to main. For a stacked PR the spec diff may describe the whole stack."
            fi
            if fetch_base main; then
              base="main"
            fi
          fi
          # Publish whichever baseline actually resolved, so the classification
          # prompt below describes (and inspects) the same one rather than
          # assuming main. Empty means no baseline at all.
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          if [ -z "${base}" ]; then
            echo "::warning::No camunda-hub baseline ref could be fetched — the spec diff is empty, so the classifier cannot tell new-vs-unchanged operations apart."
            : > "${GITHUB_WORKSPACE}/spec-diff.txt"
            exit 0
          fi
          # The base TIP, not merge-base(base, SHA): clone-hub-sibling fetches
          # --depth 1, so the two refs share no ancestor in this clone and
          # merge-base would just fail. `git diff` compares trees, so it works
          # regardless. The cost is that spec changes the base gained after this
          # PR branched off it also show up; against the right base that is a
          # far smaller window than diffing against main. Deepen both fetches if
          # the branch point is ever needed exactly.
          #
          # base FIRST, PR sha second: `git diff <old> <new>` shows +/- from
          # old to new, so this way the PR's own additions/changes show as
          # `+` — the natural reading for "what did this PR add or change
          # relative to its base." The reverse order would flip that polarity
          # (a genuinely new construct would show as REMOVED), which could
          # mislead the classifier's new-vs-changed-vs-unchanged judgment.
          git diff "origin/${base}" "${SHA}" -- restapi/public-api/src/main/resources/openapi/v2 \
            > "${GITHUB_WORKSPACE}/spec-diff.txt" || true

      # Pinned version — same as triage-camunda-hub-nightly.yml. Bump intentionally.
      - name: Install Claude Code CLI
        if: fromJSON(steps.vault.outputs.secrets || '{}').ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.156
          claude --version

      - name: Run classification agent (read-only)
        id: agent
        if: fromJSON(steps.vault.outputs.secrets || '{}').ANTHROPIC_API_KEY != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ fromJSON(steps.vault.outputs.secrets || '{}').ANTHROPIC_API_KEY }}
          REPORTS_DIR: ${{ github.workspace }}/test-results/e2e-camunda-hub
          SPEC_DIR: ${{ github.workspace }}/../camunda-hub/restapi/public-api/src/main/resources/openapi/v2
          SPEC_DIFF_FILE: ${{ github.workspace }}/spec-diff.txt
          # The baseline the diff above actually resolved to — the PR's own base
          # branch for stacked work, `main` otherwise. The prompt below must name
          # the same ref it was diffed against, and it is also the only baseline
          # fetched into the clone, so telling the agent to inspect `origin/main`
          # would both misdescribe the diff and fail outright on a stacked PR.
          # Empty when no baseline resolved; `<unavailable>` then tells the agent
          # to skip the baseline comparison rather than invent a ref.
          HUB_BASE_REF: ${{ steps.specdiff.outputs.base }}
          # The clone-hub-sibling action does a full clone, not a sparse/
          # openapi-only one -- the agent runs as a real tool-using session
          # (claude -p), so it can inspect this itself (git diff/log/grep)
          # rather than being limited to the pre-computed SPEC_DIFF_FILE,
          # which only ever covers the OpenAPI YAML.
          HUB_REPO_DIR: ${{ github.workspace }}/../camunda-hub
          # From _hub-suite-run.yml's own coverage check — comma-separated,
          # empty if none. This is the ONE failure mode with no failing test
          # to read at all (a silent skip, not an assertion failure), so it
          # needs to be handed to the agent directly rather than left for it
          # to infer from reports that won't mention it.
          UNMAPPED_OPERATIONS: ${{ inputs.unmapped-operations }}
          # Reports already parsed into per-spec attempt histories (see the evidence step).
          # Absent if that step failed; the agent then falls back to the raw reports.
          EVIDENCE_FILE: ${{ github.workspace }}/hub-pr-evidence.json
        run: |
          set -euo pipefail
          rm -f /tmp/hub-pr-classification.json

          # Render the baseline ONCE, so the prompt cannot both name a ref and
          # say the baseline is unavailable. In particular it must never fall
          # back to origin/main when nothing resolved: for a stacked PR main is
          # precisely the ref NOT fetched into the checkout, so naming it would
          # point the agent at a baseline that does not exist.
          if [ -n "${HUB_BASE_REF}" ]; then
            baseline="\`origin/${HUB_BASE_REF}\`"
            baseline_rule="Use ${baseline} as the baseline everywhere below, never \`origin/main\`: it is this PR's own base, and the only baseline fetched into the checkout."
            baseline_example="e.g. \`git -C ${HUB_REPO_DIR} diff origin/${HUB_BASE_REF} -- PATH\` (start with \`--stat\` against the whole repo to scope down before diffing anything large)"
          else
            baseline="<unavailable>"
            baseline_rule="NO baseline ref resolved, so no baseline comparison is possible. Do NOT substitute \`origin/main\` or any other ref -- it is not in the checkout. Treat every new-vs-unchanged judgment below as unestablished and say so explicitly in your summary."
            baseline_example="no baseline is available (see above), so inspect this PR's own commit directly, e.g. \`git -C ${HUB_REPO_DIR} show --stat HEAD\`, and do not compare against any baseline ref"
          fi

          prompt=$(cat <<EOF
          You are classifying a SINGLE failing generated-hub-suite run, triggered by
          a camunda-hub pull request. This is READ-ONLY with respect to the checked-
          out repos: do not modify any file inside them, do not run any git/network
          write command, do not open any issue or PR. Your ONLY required write is
          the one output file below -- writing it is expected and necessary, not an
          exception to "read-only."

          Inputs:
          - Playwright/JUnit reports: ${REPORTS_DIR} (pw-positive.json, pw-secured.json,
            pw-rbac.json, junit + HTML reports). Traces and screenshots are NOT captured; the
            evidence is the request.json / response.json attachments embedded in the JSON
            and HTML reports. May be absent if the artifact upload/download itself failed;
            say so if so.
          - Parsed evidence: ${EVIDENCE_FILE} -- every failing spec with its per-attempt
            statuses (\`deterministic: true\` = no attempt passed) and cleaned error. Prefer
            it to re-parsing the Playwright JSON; use the embedded request.json /
            response.json attachments for request/response detail. If the file is absent, parse the reports yourself.
          - OpenAPI spec AT THIS PR's SHA: ${SPEC_DIR}/*.yaml (may be absent if the
            camunda-hub clone step failed; treat as unavailable, don't guess).
          - Spec diff (this PR's sha vs its BASE branch, ${baseline}), OpenAPI dir
            only: ${SPEC_DIFF_FILE} (empty file = this PR does not touch the API
            spec, or the diff step failed). camunda-hub stacks much of its work, so
            for a stacked PR this base is a feature branch, NOT main.
            ${baseline_rule}
          - Full camunda-hub checkout AT THIS PR's SHA: ${HUB_REPO_DIR} (the complete
            repo, not just the spec dir -- may be absent under the same condition as
            the spec dir above). SPEC_DIFF_FILE only ever covers the OpenAPI YAML;
            for step 4 below, use this to inspect the PR's actual CODE changes
            yourself: ${baseline_example}.
          - Known-issue configs: configs/camunda-hub/positive-suppress.json and
            configs/camunda-hub/request-validation.json (their knownIssue /
            knownProblemDetailShapeGaps entries).
          - Unmapped (uncovered) operationIds this run found, if any: ${UNMAPPED_OPERATIONS:-<none>}
            -- these have NO generated test at all (a silent skip, not a failing
            test you'll find in the reports). This is the reason the run may have
            failed even with zero failing tests in the Playwright reports.

          Do this:
          0. If UNMAPPED_OPERATIONS is non-empty, check the spec diff for each
             listed operationId first: a new/changed operation the generator has
             never modelled yet is expected to be unmapped -> category
             "generator-gap", confidence "high", summary naming the operationId(s)
             and that api-test-generator's ontology/scenario-templates don't cover
             them yet. This is NOT a hub bug. Only fall through to the steps below
             if UNMAPPED_OPERATIONS is empty, OR the run has ADDITIONAL failing
             tests beyond just the unmapped ones (classify those the normal way).
          1. Enumerate every failing test (from the parsed evidence, falling back to the
             reports), with its request/response evidence from the embedded request.json / response.json
             attachments.
          2. Resolve each failing operationId in the OpenAPI spec at this PR's sha.
          3. Check the spec diff: is this operationId's definition NEW or CHANGED by
             this PR? If yes, and the failure looks like the generated test's
             expectations don't match the new/changed shape (wrong assumed schema,
             unhandled new construct) -> category "generator-gap" (api-test-generator
             does not yet correctly handle this shape; NOT a hub bug).
          4. If the operationId is UNCHANGED by this PR and its response contradicts
             the (unchanged) spec, that is EITHER a regression this PR introduced via
             a shared code path, OR a standing, pre-existing bug this PR happens to
             also expose -- "unchanged and still broken" does not by itself tell you
             which. This especially applies to a broad/blanket-acceptance failure
             (e.g. a handler that accepts any malformed input regardless of shape) --
             that pattern is far more often "this endpoint has probably always
             behaved this way" than "this specific PR just introduced it". To look
             for that causal link, DO NOT rely on the spec diff alone -- it only
             covers the OpenAPI YAML, not the actual implementation. Inspect the
             PR's real code diff yourself in the full checkout (see Inputs above):
             start from the PR's own changed files (see Inputs for the baseline and
             the rule that governs it) to see which files
             changed at all, then look closer at anything touching this operation's
             controller/handler, request-body deserialization, or shared
             validation/config code. Only use category "product" with confidence
             "high" when that code diff gives you a SPECIFIC causal link to THIS PR
             -- never solely because the op is unchanged and the response is wrong,
             and never from the spec diff alone (it can't show a code-only change).
             Absent that causal link: use
             "generator-gap" if the test's own assumption looks over-generalized
             (assumes uniform behavior across operations that don't actually all
             share it), or "unknown" (confidence "low") if you can't tell either way
             -- and say explicitly in your summary that you could not establish this
             PR caused it, so a maintainer should verify before treating it as a
             regression. Getting this wrong pages a real person (hub-medic) for
             something they didn't cause -- bias toward NOT paging, not toward
             paging.
          5. Reconcile against the known-issue configs first — if the failure matches
             an existing knownIssue/knownProblemDetailShapeGaps entry, use its real
             category and note it is already tracked in your summary.
          6. If Hub failed to boot, a suite produced no report, or the failure is
             clearly environmental -> category "infra".
          7. If a test passed on a Playwright retry -> category "flaky". A failing spec
             with \`deterministic: false\` (some attempt passed) is flakiness evidence,
             not a defect -- never classify it "product" on its own.
          8. If you genuinely cannot tell from the evidence (including: reports or
             spec were unavailable above) -> category "unknown" with confidence "low"
             and say what evidence was missing — never guess "product".

          "caused_by_pr" decides whether the camunda-hub PR author is told on their PR
          (otherwise only the internal Slack channel hears about it), so be strict. Set it
          true when EITHER:
            - category is "generator-gap" AND every affected operationId is NEW or CHANGED
              by this PR in the spec diff (steps 0 and 3): the author's own spec change is
              what the generator cannot yet handle; OR
            - category is "product" AND the regression is in an endpoint that this PR
              changed (the PR's own code change broke the existing behaviour).
          Set it false for everything else, including a generator gap on an operation this
          PR did not touch, an unmapped operation that already existed on the base, a
          product regression on an endpoint this PR did not touch, and any doubt.

          Write your answer to /tmp/hub-pr-classification.json as EXACTLY this shape,
          nothing else:
          {
            "category": "product|generator-gap|infra|flaky|unknown",
            "confidence": "high|medium|low",
            "summary": "<one sentence, under 200 chars, no line breaks>",
            "affected_operation_ids": ["..."],
            "caused_by_pr": true|false
          }
          EOF
          )

          set +e
          claude -p "$prompt" --dangerously-skip-permissions
          agent_rc=$?
          set -e
          echo "claude exit code: ${agent_rc}"

      - name: Parse classification (falls back to "unknown" on any failure above)
        id: parse
        if: always()
        run: |
          set -euo pipefail
          f=/tmp/hub-pr-classification.json
          caused_by_pr=false
          affected_ops=""
          if [ -s "$f" ] && jq empty "$f" 2>/dev/null; then
            category=$(jq -r '.category // "unknown"' "$f")
            confidence=$(jq -r '.confidence // "low"' "$f")
            # 200, matching the prompt's own "under 200 chars" contract —
            # not a looser bound that would let a non-compliant response
            # through longer than what we actually asked for.
            summary=$(jq -r '.summary // ""' "$f" | tr '\n' ' ' | cut -c1-200)
            # Strictly the boolean true; a string "true" or anything else is false.
            caused_by_pr=$(jq -r 'if .caused_by_pr == true then "true" else "false" end' "$f")
            # operationIds come from the PR's own spec: keep only identifier characters.
            affected_ops=$(jq -r '[.affected_operation_ids[]? | strings | gsub("[^A-Za-z0-9_.-]"; "")] | map(select(length > 0)) | join(",")' "$f" | cut -c1-300)
            # A PR-caused claim without the operations that support it is a malformed result.
            if [ -z "$affected_ops" ]; then caused_by_pr=false; fi
          else
            category="unknown"
            confidence="low"
            summary="Classification agent did not produce a usable result — see the run for details."
          fi

          # Enforce the exact enum contract for category/confidence — unlike
          # summary (already newline-stripped above), these were written to
          # $GITHUB_OUTPUT as-is. A value containing an embedded newline would
          # inject arbitrary extra lines into $GITHUB_OUTPUT (confirmed
          # locally: category="product\nfake_output=injected" produces a
          # genuine extra output line), corrupting/overriding whatever the
          # downstream Slack-routing step reads. Falling back to the same
          # "unknown"/"low" default on any non-matching value closes that off
          # entirely: only these exact, single-line literals ever reach
          # $GITHUB_OUTPUT for these two fields.
          case "$category" in
            product|generator-gap|infra|flaky|unknown) ;;
            *) category="unknown" ;;
          esac
          case "$confidence" in
            high|medium|low) ;;
            *) confidence="low" ;;
          esac

          {
            echo "category=${category}"
            echo "confidence=${confidence}"
            echo "summary=${summary}"
            # A generator-gap (high confidence) or a product regression (medium+
            # confidence) can be pinned on the PR's own change.
            if [ "$category" = "generator-gap" ] && [ "$confidence" = "high" ]; then
              echo "caused_by_pr=${caused_by_pr}"
            elif [ "$category" = "product" ] && [ "$confidence" != "low" ]; then
              echo "caused_by_pr=${caused_by_pr}"
            else
              echo "caused_by_pr=false"
            fi
            echo "affected_operation_ids=${affected_ops}"
          } >> "$GITHUB_OUTPUT"
