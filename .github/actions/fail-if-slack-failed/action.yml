name: Fail if the Slack alert failed
description: >-
  The Slack steps of the scheduled Hub workflows use continue-on-error, so a Vault or Slack problem never
  stopped the run and the alert silently did not go out. Put this as the LAST step (with `if: always()`) and pass
  the outcome of every Slack step: if any of them failed, the run is marked failed with a clear error.

inputs:
  outcomes:
    description: >-
      Space-separated outcomes of the Slack steps, for example
      "${{ steps.slack-secrets.outcome }} ${{ steps.notify.outcome }}". For a token step, pass
      "${{ (steps.T.outcome == 'success' && steps.T.outputs.SLACK_BOT_TOKEN == '') && 'failure' || steps.T.outcome }}"
      so that a step that succeeded but produced an empty token counts as a failure too (every post would be skipped).
    required: true

runs:
  using: composite
  steps:
    - name: Fail when a Slack step failed
      shell: bash
      env:
        OUTCOMES: ${{ inputs.outcomes }}
      run: |
        if [[ " ${OUTCOMES} " == *" failure "* ]]; then
          echo "::error title=Slack alert not posted::A Slack step failed (outcomes: ${OUTCOMES}). The alert for this run did not go out. Check the Vault role and the Slack bot; the tests themselves may be fine."
          exit 1
        fi
